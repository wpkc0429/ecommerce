name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://ecommerce:ecommerce@localhost:5432/ecommerce?sslmode=disable
      TEST_DATABASE_URL: postgres://ecommerce:ecommerce@localhost:5432/ecommerce_test?sslmode=disable
      REDIS_ADDR: localhost:6379
      # Unset APP_ENV = production (default-key guard refuses the dev secrets).
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Create test database
        run: |
          PGPASSWORD=ecommerce psql -h localhost -U ecommerce -d ecommerce -c "CREATE DATABASE ecommerce_test;"
      - name: Build
        working-directory: api
        run: go build ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: api
          # Built from source with the job's Go (go.mod = 1.26.11); a prebuilt binary
          # made with an older Go refuses to lint a newer-go module.
          version: v2.15.0
          install-mode: goinstall
      - name: Unit + integration tests
        working-directory: api
        run: INTEGRATION=1 go test -p 1 -count=1 ./...

  admin-guards:
    name: Admin guards
    # Cheap, Node-only: the platform admin's locked-core / design-layer guards (admin/docs/DESIGN-LAYER.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Guard checks (scan, schema, ctx surface, core hash manifest, layers, deploy/CSP)
        working-directory: admin
        run: node scripts/check-design.mjs
      - name: Guard tests (hostile fixtures must be caught)
        working-directory: admin
        run: node scripts/test-guard.mjs
      - name: Content core and publishing logic unit tests
        working-directory: admin
        run: |
          node scripts/test-content.mjs
          node scripts/test-publishing.mjs
      - name: Design branches may change only admin/design/**
        if: startsWith(github.head_ref, 'design/admin-')
        working-directory: admin
        run: node scripts/check-design.mjs --base "origin/${{ github.base_ref }}"

  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned release)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scan history (uses .gitleaks.toml and .gitleaksignore)
        run: ./gitleaks git --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact --no-banner .
