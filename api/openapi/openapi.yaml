  /api/v1/admin/shop-provisioning:
    post:
      tags: [admin-platform]
      operationId: provisionShop
      summary: 一次開好一家店
      description: |
        需要平台層 `shop.create` ＋ `account.manage`；
        帶 `storefront_origins` 時另需 `shop.manage_client_origins`（缺任一 → 403）。

        單一交易：商家（含自動首頁）、owner（新 email 建立無密碼帳號並產生設定連結；
        既有 email 直接加入並授予 `merchant_owner`，不動其密碼）、origin。任一步驟失敗整筆回滾（衝突回 409）。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, owner_email]
              properties:
                name: { type: string }
                owner_email: { type: string }
                status: { type: integer, enum: [0, 1, 2] }
                storefront_origins:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: 已開店。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  # ═══════════════════════ 公開：商家開店申請（平台官網） ═══════════════════════
  /api/v1/public/shop-applications:
    post:
      tags: [public-application]
      operationId: submitShopApplication
      summary: 送出開店申請（未認證）
      description: |
        平台官網（零建置靜態站，獨立 repo）的申請表單呼叫這一條。**無認證、無租戶解析**；
        CORS 只放行 `WEBSITE_URL` 這一個 origin（其他 origin 與其他 API 面都拿不到）。

        **通過驗證的請求一律回 `202 {"status":"received"}`，位元組逐一相同**——無論 email 是新的、
        已有未完成申請、位於 30 天再申請冷卻期、或已是後台帳號；回應內容與狀態碼無法讓人分辨這些情況
        （沒有使用者列舉）。差異只在伺服器內部：新的才建立申請並寄出（或寫入 outbox）驗證信。

        **防濫用（依序）**：body ≤ 16 KiB（413）→ 每 IP 限流（429）→ honeypot `website` 必須為空（422）
        → 欄位驗證（422）→ Cloudflare Turnstile（無效 422；服務故障 503，**不放行**）→ 每 email 限流
        （不含 IP，429）→ 全站每日上限（429）。429 都附 `Retry-After`。

        欄位驗證只取決於請求本身：`email` 必須是合法位址（≤ 254）；`contact_name`、`shop_name` 1–100 字；
        `phone` 選填，只允許數字與 `+-() `，≤ 20；`business_summary` 1–1000 字；`consent_version` 必須等於
        API 目前的條款版本；含換行等控制字元的 `contact_name` 被拒絕，`shop_name` 的控制字元被移除。
        未知欄位忽略。`elapsed_seconds`（選填，表單載入到送出的秒數）低於 3 秒只會讓審核畫面多一個旗標，不拒絕。

        Email 驗證：驗證連結為 `{WEBSITE_URL}/apply/verify#<token>`（token 在 fragment），官網頁面讀出後呼叫
        `POST /api/v1/public/shop-applications/verify`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShopApplicationSubmit' }
            examples:
              typical:
                summary: 典型請求（Turnstile 測試金鑰產生的 token 是 `XXXX.DUMMY.TOKEN.XXXX`）
                value:
                  email: owner@example.com
                  contact_name: 王小明
                  phone: "0912-345-678"
                  shop_name: 小明花坊
                  business_summary: 我們販售手作乾燥花束與花藝課程。
                  consent_version: placeholder-v0
                  turnstile_token: XXXX.DUMMY.TOKEN.XXXX
                  website: ""
                  elapsed_seconds: 42.5
      responses:
        "202":
          description: |
            已收到。**所有通過驗證的請求（新的、重複、冷卻中、已是帳號）都是這個完全相同的回應**。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopApplicationReceived' }
              examples:
                received: { value: { status: received } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "413":
          description: body 超過 16 KiB。`code = payload_too_large`。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "422":
          description: |
            `code = validation_failed`；`details` 的 JSON Pointer 之一：`/email`、`/contact_name`、`/shop_name`、
            `/phone`、`/business_summary`、`/consent_version`、`/website`（honeypot 被填）、
            `/turnstile_token`（驗證失敗，可重新取得 token 再送）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                consent:
                  summary: 條款版本不符
                  value:
                    error:
                      code: validation_failed
                      message: must equal the current terms version
                      details: [{ pointer: /consent_version, message: must equal the current terms version }]
                turnstile:
                  summary: Turnstile 驗證失敗
                  value:
                    error:
                      code: validation_failed
                      message: verification failed
                      details: [{ pointer: /turnstile_token, message: "verification failed, please retry" }]
        "429": { $ref: '#/components/responses/TooManyRequests' }
        "503":
          description: Turnstile 驗證服務無法判定（逾時、5xx 或伺服器端設定錯誤）。`code = verification_unavailable`；不建立任何資料。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/public/shop-applications/verify:
    post:
      tags: [public-application]
      operationId: verifyShopApplication
      summary: 以信中連結的 token 驗證申請信箱（未認證）
      description: |
        消費驗證 token（32 bytes 隨機、DB 只存 SHA-256、24 小時有效、單次、原子消費；同一申請重新簽發會使舊 token
        失效）。成功把申請由 `pending_verification` 轉為 `pending_review`（才可被審核端核准）。

        **無效、過期、已使用、未知一律回同一個 404**，無法分辨。token 在連結的 fragment 裡，官網頁面讀出後立刻
        `history.replaceState` 清掉，再呼叫本端點。每 IP 限流。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 256 }
            examples:
              token: { value: { token: "k3xJ9...(43 chars)" } }
      responses:
        "200":
          description: 已驗證。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopApplicationVerified' }
              examples:
                verified: { value: { status: verified } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "413":
          description: body 過大。`code = payload_too_large`。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/TooManyRequests' }

  # ═══════════════════════ 平台層：開店申請審核 ═══════════════════════
  /api/v1/admin/shop-applications:
    get:
      tags: [admin-applications]
      operationId: listShopApplications
      summary: 申請列表（新到舊）
      description: |
        需要平台層 `shop_application.view`。`status` 篩選（`pending_verification`｜`pending_review`｜`approved`｜
        `rejected`｜`expired`｜`withdrawn`），`q` 對 email／店名／聯絡人做不分大小寫的子字串比對。
        回應另帶全表的狀態計數 `counts` 與待人工處理的 outbox 訊息數 `pending_messages`（後台徽章用）。
        列表列不含自由文字欄位（商業摘要等），詳情才有。
      security: [{ adminJWT: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          description: 申請列表。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopApplicationList' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/shop-applications/{id}:
    parameters:
      - $ref: '#/components/parameters/ShopApplicationIDPath'
    get:
      tags: [admin-applications]
      operationId: getShopApplication
      summary: 申請詳情（含稽核時間線與 outbox 訊息）
      description: |
        需要平台層 `shop_application.view`。含 `email_has_account`（即時查詢：owner email 目前是否已是後台帳號）、
        `events`（稽核時間線，`detail` 不含個資）、`messages`（outbox：待人工寄出的訊息含收件人與內文，可複製）。
        不回傳來源 IP 的 HMAC。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 申請詳情。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopApplicationDetail' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/shop-applications/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/ShopApplicationIDPath'
    post:
      tags: [admin-applications]
      operationId: approveShopApplication
      summary: 核准並一次開店
      description: |
        需要平台層 `shop_application.review`，**另需**與 `POST /admin/shop-provisioning` 相同的 `shop.create` ＋
        `account.manage`（缺任一 → 403）。

        **單一資料庫交易**：條件式把申請由 `pending_review` 轉為 `approved`（且 email 已驗證）→ 開店服務建立商家
        （預設 `status` 2＝審核中，店面不可達）、owner、**不帶主題與網域** → 寫入 `provisioned_shop_id` 與稽核事件。任何一步失敗整筆回滾，
        申請維持 `pending_review` 並追記 `approve_failed` 事件。

        - 未驗證 email、非 `pending_review`、重複核准 → **409**。
        - owner email 已是後台帳號 → **409 `confirm_existing_account_required`**，須帶 `confirm_existing_account: true`；
          確認後該帳號只會被**加入成員資格**，**密碼與憑證完全不動**，回應沒有 `setup_url`。
        - 新帳號：`owner` 一次性帶回 `delivery: "manual"` 與 `setup_url`（72 小時有效）。**這個連結不寫入任何訊息列或稽核事件**，
          也不會再顯示——操作員當場複製並以其他管道交給申請者。
      security: [{ adminJWT: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShopApplicationApprove' }
            examples:
              default: { value: {} }
              override: { value: { shop_name: 小明花坊, status: 2, confirm_existing_account: false } }
      responses:
        "201":
          description: 已核准並開店。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopApplicationApproved' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shop-applications/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/ShopApplicationIDPath'
    post:
      tags: [admin-applications]
      operationId: rejectShopApplication
      summary: 拒絕（理由對申請者可見）
      description: |
        需要平台層 `shop_application.review`。`decision_reason` 必填（≤ 1000 字）並**對申請者可見**（寫入通知訊息）；
        `internal_note` 僅內部。只能拒絕 `pending_verification`／`pending_review`；已核准或已拒絕 → 409。
        被拒絕的 email 在 `APPLICATION_REAPPLY_COOLDOWN`（預設 30 天）內再申請，會得到相同的 202 但不建立新申請。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShopApplicationReject' }
            examples:
              reject: { value: { decision_reason: 商品說明不足，請補充後重新申請, internal_note: 疑似轉賣帳號 } }
      responses:
        "200":
          description: 已拒絕。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopApplication' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shop-applications/{id}/verify-manually:
    parameters:
      - $ref: '#/components/parameters/ShopApplicationIDPath'
    post:
      tags: [admin-applications]
      operationId: verifyShopApplicationManually
      summary: 人工確認聯絡方式（信件無法送達時的後備）
      description: |
        需要平台層 `shop_application.review`。把 `pending_verification` 直接轉為 `pending_review`，記稽核事件
        `verified_manually` 與風險旗標 `manually_verified`。其他狀態 → 409。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 已確認。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopApplication' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/shop-applications/{id}/messages/{mid}/mark-sent:
    parameters:
      - $ref: '#/components/parameters/ShopApplicationIDPath'
      - name: mid
        in: path
        required: true
        description: outbox 訊息 id。
        schema: { type: integer, minimum: 1 }
    post:
      tags: [admin-applications]
      operationId: markShopApplicationMessageSent
      summary: 標記 outbox 訊息已由人工寄出
      description: |
        需要平台層 `shop_application.review`。把 `pending_manual`／`queued`／`failed` 的訊息標為 `sent`
        （記錄操作者與時間、寫入稽核事件）。已是 `sent` → 409；訊息不屬於該申請 → 404。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 已標記。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, status]
                properties:
                  id: { type: integer }
                  status: { type: string, enum: [sent] }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/shops/{shopID}/setup-status:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
    get:
      tags: [admin-platform]
      operationId: getShopSetupStatus
      summary: 開店檢查清單（由資料推導）
      description: 需要平台層 `shop.view`。每一項都是當下事實的存在性查詢，系統不儲存開店進度。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 檢查清單。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ═══════════════════════ 平台層：權限與角色 ═══════════════════════
  /api/v1/admin/permissions:
    get:
      tags: [admin-platform]
      operationId: listPermissions
      summary: 列出權限目錄
      description: 需要平台層 `user.manage_roles`。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 依名稱排序的權限目錄。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [permissions]
                properties:
                  permissions:
                    type: array
                    items: { $ref: '#/components/schemas/Permission' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-platform]
      operationId: createPermission
      summary: 新增權限節點
      description: 需要平台層 `user.manage_roles`。名稱重複回 422。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "201":
          description: 已建立。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, name]
                properties:
                  id: { type: integer }
                  name: { type: string }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/roles:
    get:
      tags: [admin-platform]
      operationId: listAllRoles
      summary: 列出全部角色（含權限）
      description: 需要平台層 `user.manage_roles`。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 全部角色。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [roles]
                properties:
                  roles:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-platform]
      operationId: createRole
      summary: 新增角色
      description: 需要平台層 `user.manage_roles`。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, scope]
              properties:
                name: { type: string }
                scope: { type: string, enum: [platform, merchant] }
      responses:
        "201":
          description: 已建立。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, name, scope]
                properties:
                  id: { type: integer }
                  name: { type: string }
                  scope: { type: string, enum: [platform, merchant] }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/roles/{roleID}/permissions:
    put:
      tags: [admin-platform]
      operationId: setRolePermissions
      summary: 全量取代角色的權限集合
      description: |
        需要平台層 `user.manage_roles`。**授權／撤權立即生效**——
        持有此角色的每個人在下一次請求就看到變化，不等快取過期。
      security: [{ adminJWT: [] }]
      parameters:
        - name: roleID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [permission_ids]
              properties:
                permission_ids:
                  type: array
                  items: { type: integer }
      responses:
        "200":
          description: 已套用。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [role_id, permission_ids]
                properties:
                  role_id: { type: integer }
                  permission_ids:
                    oneOf:
                      - type: array
                        items: { type: integer }
                      - type: 'null'
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/users/{userID}/roles:
    post:
      tags: [admin-platform]
      operationId: assignPlatformRole
      summary: 指派平台層角色給使用者
      description: 需要平台層 `user.manage_roles`。角色必須是 `platform` scope，否則 422。冪等。
      security: [{ adminJWT: [] }]
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role_id]
              properties:
                role_id: { type: integer }
      responses:
        "200":
          description: 已指派。`shop_id` 恆為 `null`（平台層指派不綁商家）。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user_id, role_id, shop_id]
                properties:
                  user_id: { type: integer }
                  role_id: { type: integer }
                  shop_id:
                    oneOf: [{ type: integer }, { type: 'null' }]
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/users/{userID}/roles/{roleID}:
    delete:
      tags: [admin-platform]
      operationId: removePlatformRole
      summary: 移除使用者的平台層角色
      description: 需要平台層 `user.manage_roles`。未持有該角色回 404。
      security: [{ adminJWT: [] }]
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: roleID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ═══════════════════════ 平台層：網域綁定 ═══════════════════════
  # ═══════════════════════ 平台層：商家 ═══════════════════════
  /api/v1/admin/shops:
    get:
      tags: [admin-platform]
      operationId: listShops
      summary: 列出商家
      description: 需要平台層 `shop.list`。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          description: 商家的一頁。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-platform]
      operationId: createShop
      summary: 建立商家
      description: |
        需要平台層 `shop.create`。建立時會**自動建立一張 slug 為 `home` 的首頁**（草稿）。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string }
                status: { type: integer, enum: [0, 1, 2] }
      responses:
        "201":
          description: 已建立。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shop' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
    get:
      tags: [admin-platform]
      operationId: getShop
      summary: 取得單一商家
      description: |
        需要平台層 `shop.view`。

        **實作備註：** 這條路由與下方 `/api/v1/admin/shops/{shopID}/**` 的子 router 掛在
        同一個樣板上，因此 `chi.Walk` 列不到它（見 change openapi-contract design D3a）。
        它在執行期完全正常，且契約測試會對它做實際的可達性探測。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 商家。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shop' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-platform]
      operationId: updateShop
      summary: 修改商家
      description: |
        需要平台層 `shop.update`。只送要改的鍵。
        `status` 實際變動時，該商家所有綁定網域的路由解析快取立即失效。

        **實作備註：** 同上，`chi.Walk` 列不到這條路由（design D3a）。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                status: { type: integer, enum: [0, 1, 2] }
                meta: { type: object }
      responses:
        "200":
          description: 已修改。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shop' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  # ═══════════════════════ 平台層：主題 ═══════════════════════
  # ═══════════════════════ 商家層：CMS ═══════════════════════
  /api/v1/admin/shops/{shopID}/pages:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
    get:
      tags: [admin-cms]
      operationId: listPages
      summary: 列出頁面
      description: 需要商家層 `page.view`。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 頁面清單（精簡形狀）。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [pages]
                properties:
                  pages:
                    type: array
                    items: { $ref: '#/components/schemas/PageListEntry' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-cms]
      operationId: createPage
      summary: 建立頁面
      description: |
        需要商家層 `page.create`。`type_key` 必須被商家**當前主題**支援，否則 422
        （指標 `/type_key`）。`content` 會依該頁型的 schema 驗證。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type_key, title, slug]
              properties:
                type_key: { type: string }
                title: { type: string }
                slug: { type: string }
                content: { type: object }
                meta: { type: object }
      responses:
        "201":
          description: 已建立（草稿）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/pages/{pageID}:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
      - name: pageID
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [admin-cms]
      operationId: getPage
      summary: 取得單一頁面（含其頁型 schema）
      description: 需要商家層 `page.view`。當前主題不支援此頁型時 `page_schema` 為 `null` 且 `incompatible` 為 `true`。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 頁面。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-cms]
      operationId: updatePage
      summary: 修改頁面（只寫草稿）
      description: |
        需要商家層 `page.edit`。**只寫工作副本，不影響線上內容**——要上線必須另外呼叫發佈。
        `home` 頁的 slug 不可修改。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string }
                slug: { type: string }
                content: { type: object }
                meta: { type: object }
      responses:
        "200":
          description: 已修改。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [admin-cms]
      operationId: deletePage
      summary: 刪除頁面
      description: 需要商家層 `page.delete`。
      security: [{ adminJWT: [] }]
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/pages/{pageID}/publish:
    post:
      tags: [admin-cms]
      operationId: publishPage
      summary: 發佈頁面
      description: |
        需要商家層 `page.publish`。把草稿複製進線上欄位並使渲染快取失效——**前台立即看到**。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: pageID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 已發佈。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/pages/{pageID}/unpublish:
    post:
      tags: [admin-cms]
      operationId: unpublishPage
      summary: 取消發佈
      description: 需要商家層 `page.publish`。草稿保留不動。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: pageID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 已下線。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/pages/{pageID}/preview-token:
    get:
      tags: [admin-cms]
      operationId: issuePreviewToken
      summary: 簽發草稿預覽權杖
      description: |
        需要商家層 `page.view`。權杖交給 `GET /api/v1/render/preview` 使用；
        每次預覽都會重新確認持有者當下仍有 `page.view`。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: pageID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 短效預覽權杖。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [preview_token, expires_in, slug]
                properties:
                  preview_token: { type: string }
                  expires_in: { type: integer }
                  slug: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/shops/{shopID}/content:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
    get:
      tags: [admin-cms]
      operationId: getShopContent
      summary: 取得全站內容與其 schema
      description: 需要商家層 `shop.view`。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 全站內容與當前主題的 `config_schema`。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [content, config_schema]
                properties:
                  content:
                    description: 已依 schema 補齊預設值的全站內容。
                  config_schema:
                    oneOf: [{ type: object }, { type: 'null' }]
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-cms]
      operationId: updateShopContent
      summary: 更新全站內容
      description: 需要商家層 `shop.update`。依當前主題的 `config_schema` 驗證，失敗回 422 並帶 JSON Pointer。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content: { type: object }
      responses:
        "200":
          description: 已更新。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [shop_id, content]
                properties:
                  shop_id: { type: integer }
                  content: { type: object }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/page-types:
    get:
      tags: [admin-cms]
      operationId: listPageTypes
      summary: 列出商家內容 schema 的頁型
      description: 需要商家層 `page.view`（或等價的 `content.view`）。商家尚未註冊內容 schema 時回空陣列；全域內容的 `global` 型別不在其中。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
      responses:
        "200":
          description: 頁型清單（依 `id` 遞增）。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [page_types]
                properties:
                  page_types:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [type_key]
                      properties:
                        type_key: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/shops/{shopID}/content/schema:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
    get:
      tags: [admin-cms]
      operationId: getContentSchema
      summary: 讀取商家的內容 schema（生效版本或指定版本）
      description: |
        需要商家層 `content.view`（`page.*` 不通過這條新路由）。預設回生效版本（最大 `version`）；
        `?version=N` 回指定版本，加 `include=snapshot` 在該版本有快照時一併回傳註冊當下保存的內容。
        商家尚未註冊任何 schema 回 404 `content_schema_not_found`，訊息附註冊端點。
      security: [{ adminJWT: [] }]
      parameters:
        - name: version
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: include
          in: query
          required: false
          schema: { type: string, enum: [snapshot] }
      responses:
        "200":
          description: 版本與其 schema 文件。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentSchemaVersion' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-cms]
      operationId: registerContentSchema
      summary: 註冊（或 dry run）商家的內容 schema
      description: |
        需要商家層 `content.manage`——只有 `merchant_owner` 與平台 `super_admin` 持有。
        **註冊是人工動作**：CI、AI 編輯服務、服務帳號都不得持有此節點，也不得自動呼叫（docs/content-schema.md）。

        Body 是 `content.schema.json`（format 2，上限 128 KiB）。依序驗證：主體大小與 JSON（拒絕重複鍵）、
        結構上限（深度 8、節點 2,000、每個 object 50 個屬性、`enum` 100 個值）、詞彙 allowlist（只允許本地 `#/$defs/…` 的
        `$ref`、每個 object `additionalProperties: false`、每個 string `maxLength`、每個 array `maxItems ≤ 200`）、`$ref` 環與展開
        節點數（≤ 5,000）、draft 2020-12 編譯、schema 必須接受自己的預設值（2 秒預算）、`documents`／`collections` 鍵名。
        任何一步失敗回 422 並附 JSON Pointer，且不寫入。

        - `?dry_run=true`：只驗證並回相容性報告，**不寫入**（每分鐘 10 次）。
        - 內容與生效版本相同（sha256）：200、`changed: false`、版本不增加。
        - 新 schema 會丟棄既有文件的有值欄位、或使文件失去 type：缺 `?confirm_removals=true` 回 409
          `removals_require_confirmation`（`details.report` 為報告）；帶了則註冊，並在同一交易保存有風險文件的草稿／已發佈內容快照。
        - 註冊從不改寫任何文件；不再通過驗證的頁面被標記 `needs_attention`，其已發佈內容照常提供。
        - 每商家每呼叫者每小時 20 次；每次呼叫留下稽核紀錄（版本列的 `created_by_user_id` 與結構化日誌）。
      security: [{ adminJWT: [] }]
      parameters:
        - name: dry_run
          in: query
          required: false
          schema: { type: boolean }
        - name: confirm_removals
          in: query
          required: false
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "`content.schema.json`（format 2）：`{format:2, types:{key:{title,schema}}, documents?, collections?}`。"
      responses:
        "200":
          description: 註冊結果（或 dry run 報告）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentSchemaRegisterResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationFailed' }
        "429": { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/shops/{shopID}/content/schema/versions:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
    get:
      tags: [admin-cms]
      operationId: listContentSchemaVersions
      summary: 列出商家內容 schema 的所有版本（新到舊）
      description: 需要商家層 `content.view`。不含 schema 本文，讀單一版本用 `GET …/content/schema?version=N`。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 版本清單。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentSchemaVersionList' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ═══════════════════════ 商家層：RBAC ═══════════════════════
  /api/v1/admin/shops/{shopID}/me:
    get:
      tags: [admin-rbac]
      operationId: getMeInShop
      summary: 取得呼叫者在此商家的有效權限
      description: |
        **不需要任何權限節點**，只需要已認證且通過跨店存取守衛——「我在這家店能做什麼」
        必須是每個進得了這家店的人都答得出來的自我資訊（change admin-commerce-catalog
        design D5）。以任一既有節點（例如 `shop.view`）當守衛，會讓只被授予 `product.view`
        的自訂角色拿到 403 而看到空白後台。

        回傳的是**三層判定後**的結果（個人覆蓋優先於角色聯集），不是角色權限的原始聯集；
        節點清單由權限目錄推導，新增權限節點時自動涵蓋。回應只含呼叫者自己的權限。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
      responses:
        "200":
          description: 呼叫者於此商家的有效權限節點。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopPermissions' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/shops/{shopID}/roles:
    get:
      tags: [admin-rbac]
      operationId: listMerchantRoles
      summary: 列出可指派的商家角色
      description: 需要商家層 `user.view`。只回 `merchant` scope 的角色。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
      responses:
        "200":
          description: 商家角色。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [roles]
                properties:
                  roles:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/shops/{shopID}/users:
    get:
      tags: [admin-rbac]
      operationId: listShopUsers
      summary: 列出商家的後台使用者及其角色
      description: 需要商家層 `user.view`。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
      responses:
        "200":
          description: 使用者清單。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/ShopUser' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/shops/{shopID}/users/{userID}/roles:
    post:
      tags: [admin-rbac]
      operationId: assignShopRole
      summary: 指派商家角色
      description: |
        需要商家層 `user.manage_roles`。角色必須是 `merchant` scope 且目標使用者必須是本商家成員，
        否則 422。冪等。**授權立即生效。**

        **商家層呼叫者（不持平台角色者）只能指派 `merchant_assignable = true` 的角色**，
        且不得對持有不可委派角色（例如另一位 owner）的成員、或對自己做角色變更；
        `merchant_owner` 的授予與移除只有平台管理員能做。違反回 403（對自己為 409）。
        （change merchant-staff-role：這收緊了先前 owner 可指派 `merchant_owner` 的行為。）
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: userID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role_id]
              properties:
                role_id: { type: integer }
      responses:
        "200":
          description: 已指派。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user_id, role_id, shop_id]
                properties:
                  user_id: { type: integer }
                  role_id: { type: integer }
                  shop_id: { type: integer }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/users/{userID}/roles/{roleID}:
    delete:
      tags: [admin-rbac]
      operationId: removeShopRole
      summary: 移除商家角色指派
      description: |
        需要商家層 `user.manage_roles`。**撤權立即生效。**
        商家層呼叫者不得對持有不可委派角色的成員（403）或自己（409）移除角色；平台管理員不受限。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: userID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: roleID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ═══════════════════════ 商家層：目錄 ═══════════════════════
  /api/v1/admin/shops/{shopID}/categories:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
    get:
      tags: [admin-catalog]
      operationId: listCategories
      summary: 列出分類
      description: |
        需要商家層 `category.view`。**預設回樹狀**（`children` 巢狀）；
        帶 `flat=1` 改回扁平清單。兩種形狀的 `categories` 是同一個鍵、不同的元素形狀。
      security: [{ adminJWT: [] }]
      parameters:
        - name: flat
          in: query
          required: false
          description: 帶 `1` 時回扁平清單而非樹狀。
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: 分類（樹狀或扁平）。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [categories]
                properties:
                  categories:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/CategoryNode'
                        - $ref: '#/components/schemas/Category'
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-catalog]
      operationId: createCategory
      summary: 建立分類
      description: 需要商家層 `category.create`。`parent_id` 必須屬於同一商家，否則 422。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
                parent_id:
                  oneOf: [{ type: integer }, { type: 'null' }]
                position: { type: integer, format: int32 }
      responses:
        "201":
          description: 已建立。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/categories/{categoryID}:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
      - name: categoryID
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [admin-catalog]
      operationId: getCategory
      summary: 取得單一分類
      description: 需要商家層 `category.view`。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 分類。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-catalog]
      operationId: updateCategory
      summary: 修改分類
      description: |
        需要商家層 `category.edit`。`parent_id` 與 `clear_parent` 分別表達「改掛父層」
        與「移到根層」——兩者都省略即維持不變。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                slug: { type: string }
                parent_id:
                  oneOf: [{ type: integer }, { type: 'null' }]
                clear_parent: { type: boolean, description: 設為 `true` 把此分類移到根層。 }
                position: { type: integer, format: int32 }
      responses:
        "200":
          description: 已修改。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [admin-catalog]
      operationId: deleteCategory
      summary: 刪除分類
      description: 需要商家層 `category.delete`。
      security: [{ adminJWT: [] }]
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/categories/{categoryID}/product-order:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
      - name: categoryID
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [admin-catalog]
      operationId: getCategoryProductOrder
      summary: 取得分類內的商品手動排序
      description: |
        需要商家層 `category.view`。回傳**直接**關聯於此分類的商品（含草稿），依 `position`、`product_id`。
        子分類的商品不在此列。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 排序。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryProductOrder' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-catalog]
      operationId: setCategoryProductOrder
      summary: 設定分類內的商品手動排序
      description: |
        需要商家層 `category.edit`。`product_ids` 必須**恰好是**目前直接關聯商品的一個排列
        （不得缺、不得多、不得重複），否則 422 且順序不變。回傳新的排序。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [product_ids]
              properties:
                product_ids:
                  type: array
                  items: { type: integer }
      responses:
        "200":
          description: 已設定。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryProductOrder' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/products:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
    get:
      tags: [admin-catalog]
      operationId: listProductsAdmin
      summary: 列出商品（含草稿）
      description: |
        需要商家層 `product.view`。

        `q` 為選填關鍵字，對 `title`、`slug` 與該商品任一 SKU 的 `sku_code` 做
        **大小寫不敏感的子字串比對**，範圍是該商家的整個目錄（不是當頁）。
        不帶 `q` 時行為與此參數引入前完全相同。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: category_id
          in: query
          required: false
          schema: { type: integer }
        - name: status
          in: query
          required: false
          schema: { type: integer, enum: [0, 1] }
        - name: q
          in: query
          required: false
          description: 關鍵字（比對 `title` / `slug` / `sku_code`）。
          schema: { type: string }
          examples:
            keyword:
              value: 康乃馨
      responses:
        "200":
          description: 商品的一頁。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-catalog]
      operationId: createProduct
      summary: 建立商品（含巢狀 SKU）
      description: |
        需要商家層 `product.create`。`skus` 在同一交易內一併建立。
        `price_amount` 是**最小貨幣單位整數**。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, slug]
              properties:
                title: { type: string }
                slug: { type: string }
                subtitle: { type: string, maxLength: 200, description: 副標；上限 200 字元。 }
                description: { type: string }
                status: { type: integer, enum: [0, 1] }
                meta: { type: object }
                category_ids:
                  type: array
                  items: { type: integer }
                skus:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [sku_code, price_amount]
                    properties:
                      sku_code: { type: string }
                      options: { type: object }
                      price_amount: { $ref: '#/components/schemas/MinorUnitAmount' }
                      currency: { type: string, minLength: 3, maxLength: 3 }
                      stock_qty: { type: integer, format: int32, minimum: 0 }
                      is_active: { type: boolean }
      responses:
        "201":
          description: 已建立。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/products/{productID}:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
      - name: productID
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [admin-catalog]
      operationId: getProductAdmin
      summary: 取得單一商品
      description: 需要商家層 `product.view`。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 商品（含 `skus`、`category_ids`）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-catalog]
      operationId: updateProduct
      summary: 修改商品（分類全量取代、SKU upsert）
      description: |
        需要商家層 `product.edit`。

        - 送出 `category_ids` 即**全量取代**分類關聯（以差集實作：保留下來的關聯不會被重設手動排序，
          新加入的排在該分類最後）。
        - 未送 `subtitle` 保持原值；送 `""` 清空。
        - 送出 `skus` 即 upsert：帶 `id` 的更新、不帶 `id` 的新建、
          **既有但未出現在酬載中的會被刪除**。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string }
                slug: { type: string }
                subtitle: { type: string, maxLength: 200, description: 副標；上限 200 字元。 }
                description: { type: string }
                status: { type: integer, enum: [0, 1] }
                meta: { type: object }
                category_ids:
                  type: array
                  items: { type: integer }
                skus:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [sku_code, price_amount]
                    properties:
                      id: { type: integer, description: 帶 `id` 表示更新既有 SKU。 }
                      sku_code: { type: string }
                      options: { type: object }
                      price_amount: { $ref: '#/components/schemas/MinorUnitAmount' }
                      currency: { type: string, minLength: 3, maxLength: 3 }
                      stock_qty: { type: integer, format: int32, minimum: 0 }
                      is_active: { type: boolean }
      responses:
        "200":
          description: 已修改。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [admin-catalog]
      operationId: deleteProduct
      summary: 刪除商品
      description: |
        需要商家層 `product.delete`。既有訂單品項**不受影響**——它們是快照，不是關聯。
      security: [{ adminJWT: [] }]
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  # ═══════════════════════ 商家層：商品圖片與媒體（change product-images-r2）═══════════════════════
  /api/v1/admin/media/config:
    get:
      tags: [admin-media]
      operationId: getMediaConfig
      summary: 媒體儲存是否已設定
      description: |
        已認證即可。admin 前端依 `enabled` 決定是否顯示上傳控件。未設定時 `enabled=false`、
        `public_base_url=""`；此端點本身永遠是 200。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 媒體設定摘要。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaConfig' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/v1/admin/shops/{shopID}/media/uploads:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
    post:
      tags: [admin-media]
      operationId: createMediaUpload
      summary: 建立上傳意圖並取得 presigned PUT 網址
      description: |
        `purpose=product_image` 需要 `product.edit`，`content_image` 需要 `page.edit`（在處理器內依 body 判定）。

        流程：本端點 → 瀏覽器以 `headers` 原樣 `PUT upload_url`（body 為檔案本身，
        大小必須等於 `size_bytes`）→ `POST .../products/{productID}/images` 或
        `POST .../media/content-images`。網址 10 分鐘內有效。

        伺服器只接受 `image/jpeg`、`image/png`、`image/webp`；**HEIC/HEIF 回 422**，
        前端必須先在瀏覽器內轉成 JPEG。未設定媒體儲存時回 503 `media_not_configured`。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_type, size_bytes, purpose]
              properties:
                content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
                size_bytes: { type: integer, minimum: 1, description: 檔案位元組數；上限 15 MiB。 }
                purpose: { type: string, enum: [product_image, content_image] }
      responses:
        "201":
          description: 上傳意圖。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUpload' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationFailed' }
        "503": { $ref: '#/components/responses/MediaNotConfigured' }

  /api/v1/admin/shops/{shopID}/media/content-images:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
    post:
      tags: [admin-media]
      operationId: createContentImage
      summary: 把已上傳的檔案轉成 CMS 內容圖片
      description: |
        需要 `page.edit`。與商品圖片相同的轉檔管線（thumb 480／large 1600，WebP），
        但不建立資料列；回傳的 `urls.large` 就是填進 CMS `x-editor: image` 欄位的值。
        `upload_id` 必須是 `purpose=content_image` 的意圖；重用回 409。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [upload_id]
              properties:
                upload_id: { type: string, format: uuid }
      responses:
        "201":
          description: 兩個變體的公開網址與 large 的實際尺寸。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentImage' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationFailed' }
        "503": { $ref: '#/components/responses/MediaNotConfigured' }

  /api/v1/admin/shops/{shopID}/products/{productID}/images:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
      - name: productID
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [admin-media]
      operationId: listProductImages
      summary: 列出商品圖片
      description: 需要 `product.view`。依 `position`、`id` 遞增。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 圖片集合。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductImageList' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/MediaNotConfigured' }
    post:
      tags: [admin-media]
      operationId: createProductImage
      summary: 由上傳意圖建立商品圖片（伺服器轉檔）
      description: |
        需要 `product.edit`。伺服器讀回已 PUT 的原檔，**以實際內容**驗證為 JPEG/PNG/WebP 且像素
        不超過上限，依 EXIF 轉正、轉成 WebP 並產生 `thumb`（長邊 480）與 `large`（長邊 1600）兩個
        變體（只縮不放），寫入後刪除原檔。回 201 時圖片已可由公開網址讀取。
        新圖排在最後；每商品上限 20 張（超過回 409）。`upload_id` 重用回 409；他店、過期、
        purpose 不符或內容不符一律 422。圖片是商品的子資源，**不經由商品 PUT**。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [upload_id]
              properties:
                upload_id: { type: string, format: uuid }
                alt: { type: string, maxLength: 300, description: 替代文字；上限 300 字元，預設空字串。 }
      responses:
        "201":
          description: 新建立的圖片。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductImage' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationFailed' }
        "503": { $ref: '#/components/responses/MediaNotConfigured' }

  /api/v1/admin/shops/{shopID}/products/{productID}/images/order:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
      - name: productID
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    put:
      tags: [admin-media]
      operationId: reorderProductImages
      summary: 整批重排商品圖片
      description: |
        需要 `product.edit`。`image_ids` 必須**恰好**是該商品目前全部圖片 id 的一個排列，
        否則 422 且不做任何變更（不允許部分排序）。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [image_ids]
              properties:
                image_ids:
                  type: array
                  items: { type: integer }
      responses:
        "200":
          description: 重排後的圖片集合。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductImageList' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }
        "503": { $ref: '#/components/responses/MediaNotConfigured' }

  /api/v1/admin/shops/{shopID}/products/{productID}/images/{imageID}:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
      - name: productID
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: imageID
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    put:
      tags: [admin-media]
      operationId: updateProductImage
      summary: 修改圖片的替代文字
      description: 需要 `product.edit`。只能改 `alt`（≤ 300 字元）。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [alt]
              properties:
                alt: { type: string, maxLength: 300 }
      responses:
        "200":
          description: 修改後的圖片。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductImage' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }
        "503": { $ref: '#/components/responses/MediaNotConfigured' }
    delete:
      tags: [admin-media]
      operationId: deleteProductImage
      summary: 刪除商品圖片
      description: 需要 `product.edit`。資料列於交易內刪除，物件於提交後 best-effort 刪除。
      security: [{ adminJWT: [] }]
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/MediaNotConfigured' }

  # ═══════════════════════ 商家層：訂單與金流 ═══════════════════════
  /api/v1/admin/shops/{shopID}/orders:
    get:
      tags: [admin-commerce]
      operationId: listOrdersAdmin
      summary: 列出商家訂單
      description: |
        需要商家層 `order.view`。

        除 `status` 外的篩選參數皆由 change admin-commerce-operations（design D3）新增，
        全部選填；一個都不帶時，查詢與回應與它們存在之前完全相同。它們必須在伺服器端執行——
        列表是分頁的，在前端過濾只看得到當頁，會對「符合條件但在第 3 頁」的訂單回報不存在。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          schema: { type: integer, enum: [0, 1] }
        - name: payment_status
          in: query
          required: false
          description: |
            精確比對 `payment_status`。刻意不宣告 enum：該欄位的列舉由 payment-integration
            擁有（order-management design D5），在此複製一份只會產生兩份會漂移的真相。
            不認得的值篩出零筆。
          schema: { type: integer, minimum: 0 }
        - name: fulfillment_status
          in: query
          required: false
          description: 精確比對 `fulfillment_status`（列舉由 shipping-logistics 擁有，理由同上）。
          schema: { type: integer, minimum: 0 }
        - name: delivery_from
          in: query
          required: false
          description: |
            `requested_delivery_date` 的下界（含）。日曆日，不是瞬間——該欄位是 Postgres `date`，
            因此這個篩選對每個時區的每個呼叫端都是同一個答案（design D4）。
            **未指定配送日的訂單在帶任一界限時一律被排除**（NULL 比較為假）。
          schema: { type: string, format: date }
        - name: delivery_to
          in: query
          required: false
          description: '`requested_delivery_date` 的上界（含）。語意同 `delivery_from`。'
          schema: { type: string, format: date }
        - name: member_id
          in: query
          required: false
          description: |
            精確比對 `member_id`（change member-directory, design D2）。「這位顧客買過什麼」由本列表
            回答，而不是由顧客端點另外回傳一份訂單內容——訂單的形狀在三個 change 裡動過三次，
            兩份序列化遲早會分歧，而分歧的樣子是「顧客頁上的金額和訂單頁上的不一樣」。
            商家範圍仍然適用：屬於別家商家的顧客 id 只會篩出零筆。
          schema: { type: integer, minimum: 1 }
        - name: q
          in: query
          required: false
          description: |
            關鍵字：對收件人姓名與電話做大小寫不敏感的子字串比對；可解析為正整數時另比對訂單編號。
            不比對地址行——商家找的是人，比對 `line1` 會讓「台北」回傳半個城市的訂單。
          schema: { type: string }
      responses:
        "200":
          description: 訂單的一頁。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/shops/{shopID}/orders/{orderID}:
    get:
      tags: [admin-commerce]
      operationId: getOrderAdmin
      summary: 取得單一訂單
      description: 需要商家層 `order.view`。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: orderID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 訂單。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/shops/{shopID}/orders/{orderID}/cancel:
    post:
      tags: [admin-commerce]
      operationId: cancelOrderAdmin
      summary: 商家取消訂單
      description: |
        需要商家層 `order.cancel`。歸還庫存。已付款或已出貨回 409。
        訂單已核發的點數會由事件扣回。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: orderID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 已取消的訂單。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/shops/{shopID}/payments:
    get:
      tags: [admin-commerce]
      operationId: listShopPayments
      summary: 以金流商的識別碼反查付款與訂單（人工對帳）
      description: |
        需要商家層 `payment.view`。

        **這條端點的存在理由是方向。** `…/orders/{orderID}/payments` 要求你
        **先知道訂單編號**，而人工對帳的起點恰好相反：商家手上是金流商後台的
        一筆交易。

        `q` 對兩個識別碼做**精確比對**（前後空白會被去除）：
        `provider_reference`（我們產生的，綠界的 `MerchantTradeNo`）與
        `provider_transaction_id`（金流商產生的，綠界的 `TradeNo`）；`q` 是正整數
        時另外比對訂單編號。**刻意不是子字串搜尋**——對帳的動作是把號碼貼過來，
        模糊比對在這裡不增加能力，卻會讓 `1` 撈回半個資料表。

        不帶 `q` 時回傳該商家的付款流水帳，依 `id` 遞減。屬於其他商家的識別碼
        回傳空清單。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: q
          in: query
          required: false
          description: 金流商識別碼（任一個）或訂單編號，精確比對。
          schema: { type: string }
          examples:
            ecpayTradeNo: { value: "2412311225437371" }
            merchantTradeNo: { value: "O1234TMZQ8K3PA" }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 付款紀錄分頁。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/shops/{shopID}/orders/{orderID}/payments:
    get:
      tags: [admin-commerce]
      operationId: listOrderPayments
      summary: 列出訂單的付款紀錄
      description: 需要商家層 `payment.view`。同一訂單可能有多次嘗試。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: orderID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 付款紀錄。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [payments]
                properties:
                  payments:
                    type: array
                    items: { $ref: '#/components/schemas/Payment' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ═══════════════════════ 商家層：物流 ═══════════════════════
  /api/v1/admin/shops/{shopID}/orders/{orderID}/shipments:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
      - name: orderID
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [admin-commerce]
      operationId: listShipments
      summary: 列出訂單的出貨紀錄
      description: |
        需要商家層 `shipment.view`。**一張訂單可以有多筆**（change partial-shipment）。
        順序為識別碼遞減（最新的在前），與顧客端的複數端點一致。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 出貨紀錄。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [shipments]
                properties:
                  shipments:
                    type: array
                    items: { $ref: '#/components/schemas/Shipment' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    post:
      tags: [admin-commerce]
      operationId: createShipment
      summary: 建立出貨紀錄（＝出貨事件本身）
      description: |
        需要商家層 `shipment.create`。**建立這筆紀錄就是「出貨」這個事件**，
        因此狀態直接是 `1`（已出貨），並依所有出貨紀錄重新推導訂單的 `fulfillment_status`。
        `carrier` 必填。

        **`items` 省略 ＝ 出貨全部尚未出貨的品項**（change partial-shipment）。因此不帶
        `items` 的請求與本能力引入品項概念之前逐位元組相同——既有呼叫端一個字都不用改。
        帶了 `items` 就是部分出貨。

        409 的四種情形：訂單已取消、**訂單尚未付款**（`payment_status` 不是已付款；
        未付款、已退款、部分退款皆不可出貨——change order-and-invitation-polish）、訂單已無未出貨數量、
        訂單已有出貨被標記為退貨（已退貨的訂單不再接受新的出貨）。資料模型目前沒有
        貨到付款／付款方式旗標，所以規則是嚴格的「已付款才能出貨」。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [carrier]
              properties:
                carrier: { type: string }
                tracking_number:
                  oneOf: [{ type: string }, { type: 'null' }]
                items:
                  type: array
                  minItems: 1
                  description: |
                    本次要出貨的訂單品項與數量。**省略即為出貨全部未出品項**；
                    給一個空陣列會回 422（「要出貨但一件都不出」是矛盾，不是預設值）。
                    每個 `order_item_id` MUST 屬於本訂單且 MUST NOT 重複，
                    `quantity` MUST 大於 0 且不得超過該品項尚未出貨的數量。
                  items:
                    type: object
                    additionalProperties: false
                    required: [order_item_id, quantity]
                    properties:
                      order_item_id:
                        type: integer
                        description: 對應 `Order.items[].id`（不是 `sku_id`——同一 SKU 可因卡片訊息不同而成為兩列）。
                      quantity: { type: integer, format: int32, minimum: 1 }
      responses:
        "201":
          description: 已出貨。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/orders/{orderID}/shipments/{shipmentID}:
    put:
      tags: [admin-commerce]
      operationId: advanceShipment
      summary: 推進出貨狀態
      description: |
        需要商家層 `shipment.update`。只接受 `"delivered"` 或 `"returned"`，兩者皆為終態。
        **`returned` 另需 `shipment.return`**（change merchant-staff-role）：缺少時回 403，
        且出貨、訂單與點數皆不變；`delivered` 只需 `shipment.update`。

        訂單的 `fulfillment_status` 由**所有**出貨紀錄重新推導，不是直接套用本次的目標狀態
        （change partial-shipment）：兩箱之中的一箱送達，訂單仍是 `1` 已出貨。

        推進到 `returned` 會觸發**整筆訂單**的點數扣回（即使該箱只裝了一部分品項），
        且該訂單自此不再接受新的出貨。

      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: orderID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: shipmentID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [delivered, returned] }
      responses:
        "200":
          description: 已推進。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/shipping-methods:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
    get:
      tags: [admin-commerce]
      operationId: listShippingMethodsAdmin
      summary: 列出運送方式（含已停用）
      description: 需要商家層 `shipping_method.view`。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 全部運送方式。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [shipping_methods]
                properties:
                  shipping_methods:
                    type: array
                    items: { $ref: '#/components/schemas/ShippingMethod' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-commerce]
      operationId: createShippingMethod
      summary: 建立運送方式
      description: |
        需要商家層 `shipping_method.create`。`flat_rate` 是最小貨幣單位整數，
        且**以訂單幣別計價**（本階段運送方式沒有自己的幣別欄位）。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, carrier, flat_rate]
              properties:
                name: { type: string }
                carrier: { type: string }
                flat_rate: { $ref: '#/components/schemas/MinorUnitAmount' }
                is_active: { type: boolean }
      responses:
        "201":
          description: 已建立。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShippingMethod' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/shipping-methods/{shippingMethodID}:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
      - name: shippingMethodID
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [admin-commerce]
      operationId: getShippingMethod
      summary: 取得單一運送方式
      description: 需要商家層 `shipping_method.view`。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 運送方式。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShippingMethod' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-commerce]
      operationId: updateShippingMethod
      summary: 修改運送方式
      description: |
        需要商家層 `shipping_method.edit`。
        **改價不影響既有訂單**——運費在結帳當下已快照進訂單。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                carrier: { type: string }
                flat_rate: { $ref: '#/components/schemas/MinorUnitAmount' }
                is_active: { type: boolean }
      responses:
        "200":
          description: 已修改。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShippingMethod' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [admin-commerce]
      operationId: deleteShippingMethod
      summary: 刪除運送方式
      description: |
        需要商家層 `shipping_method.delete`。
        **既有訂單不受影響**：訂單上的 `shipping_method_id` 是無外鍵的資訊性欄位，
        名稱與運費早已快照。
      security: [{ adminJWT: [] }]
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ═══════════════════════ 商家層：會員等級與點數 ═══════════════════════
  /api/v1/admin/shops/{shopID}/member-tiers:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
    get:
      tags: [admin-commerce]
      operationId: listMemberTiers
      summary: 列出會員等級
      description: 需要商家層 `member_tier.view`。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 會員等級。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [member_tiers]
                properties:
                  member_tiers:
                    type: array
                    items: { $ref: '#/components/schemas/MemberTier' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-commerce]
      operationId: createMemberTier
      summary: 建立會員等級
      description: 需要商家層 `member_tier.create`。`min_points` 是**點數**不是金額。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, min_points]
              properties:
                name: { type: string }
                min_points: { type: integer, format: int32, minimum: 0 }
