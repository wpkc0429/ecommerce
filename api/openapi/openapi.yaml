        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          description: 帳號的一頁。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-platform]
      operationId: createAccount
      summary: 建立後台帳號（不設密碼）
      description: |
        需要平台層 `account.manage`。帳號建立時**沒有密碼**，回應帶一次性的密碼設定連結。
        可同時以 `shop_id` ＋ `role_id`（merchant scope 角色）建立成員資格；兩者須一起給。
        **此 API 不接受由管理員提供的密碼**（多餘的 `password` 欄位被忽略）。
        email 已存在回 409。

        **消費端 MUST 先看 `delivery`**：`manual` 時回應含 `setup_url`；日後改為 `email` 時**不再回傳連結**。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
