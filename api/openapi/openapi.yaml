      operationId: issueAccountPasswordReset
      summary: 產生一次性密碼重設連結
      description: |
        需要平台層 `account.manage`。同一帳號先前未使用的重設連結立即失效。
        **消費端 MUST 先看 `delivery`**：`manual` 時含 `reset_url`。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 已產生。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResetLink' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
