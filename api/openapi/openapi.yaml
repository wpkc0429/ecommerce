      summary: 自己的點數與等級
      description: |
        點數在訂單**付款成功**後由事件核發，基準是 **`subtotal_amount − discount_amount`
        （實付商品金額），運費不計點、等級折抵也不計點**。
        文案請寫「實付商品金額每 100 元 1 點（運費不計）」。

        回應的 `level` 含該等級的 `discount_percent`，**這是會員前台在結帳前預估折抵金額的
        唯一資料來源**（平台刻意不另設預估端點）。預估請用與伺服器相同的整數公式：
        `floor(小計 × discount_percent / 100)`。
      security: [{ memberJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
      responses:
        "200":
          description: 點數與等級。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPoints' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

