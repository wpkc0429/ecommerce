        - $ref: '#/components/parameters/PublishableKey'
      responses:
        "200":
          description: 訂單。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/shop/guest/order/payments:
    post:
      tags: [guest]
      operationId: initiateGuestPayment
      summary: 以訂單存取權杖發起付款
      description: 請款金額是該訂單的 `total_amount`。已取消或已付款回 409。
      security: [{ orderAccessToken: [] }]
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                provider: { type: string }
      responses:
        "201":
          description: 已建立付款嘗試。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentInitiateResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/shop/guest/order/shipment:
    get:
      tags: [guest]
      operationId: getGuestShipment
      summary: 以訂單存取權杖查詢出貨紀錄（單筆）
      description: |
        尚未出貨回 404。訂單有多筆出貨時回**最近的一筆**（change partial-shipment）；
        要看全部請用 `GET /api/v1/shop/guest/order/shipments`。
      security: [{ orderAccessToken: [] }]
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
      responses:
        "200":
          description: 出貨紀錄。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/shop/guest/order/shipments:
    get:
      tags: [guest]
      operationId: listGuestShipments
      summary: 以訂單存取權杖查詢所有出貨紀錄
      description: |
        回傳該訂單的全部出貨紀錄，順序為識別碼遞減。尚未出貨時回 **200 與空陣列**。

        訪客與會員在此完全對等（change partial-shipment）：ONDO 全站沒有登入 UI，
        「只給會員」等於「沒有人看得到」。
      security: [{ orderAccessToken: [] }]
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
      responses:
        "200":
          description: 出貨紀錄集合。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [shipments]
                properties:
                  shipments:
                    type: array
                    items: { $ref: '#/components/schemas/Shipment' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ═══════════════════════ 金流回呼 ═══════════════════════
  /api/v1/webhooks/payments/{provider}:
    post:
      tags: [webhooks]
      operationId: paymentWebhook
      summary: 金流服務商回呼
      description: |
        **刻意掛在所有租戶／會員／後台中介層之外**：呼叫者是服務商的伺服器，
        它不知道我們的網域配置，也沒有 JWT。身分由簽章決定。

        請求主體是**服務商自訂的格式**，本 API 對它不做任何形狀假設——
        簽章驗證必須跑在**原始位元組**上（body 上限 64 KiB）。

        **冪等**：同一筆回呼重送多次結果相同。認不出 `provider_reference` 時
        **受理**而不是回 404——簽章已經證明呼叫者身分，回錯誤只會招來無止境的
        重試，也會洩漏我們認不認得這筆交易。

        **回應形狀由服務商決定，不是由本 API 決定**（change
        ecpay-payment-provider）。這條端點的呼叫者是服務商的伺服器，它的協定
        是它自己的：綠界要求收到**純文字 `1|OK`**，收不到就每隔 5~15 分鐘重送、
        當天最多 4 次。因此同一條路徑會依 `{provider}` 回傳不同的 content type：

        | provider | 已受理 | 驗簽失敗 | 我方處理失敗 |
        |---|---|---|---|
        | `mock` | `200 application/json {"status":"ok"\|"ignored"}` | `401` 錯誤信封 | `500` 錯誤信封 |
        | `ecpay` | `200 text/plain 1\|OK` | `200 text/plain 0\|CheckMacValue Error` | `500 text/plain 0\|Internal Error` |

        `ecpay` 只有「我方處理失敗」是非 2xx，因為那是唯一重送幫得上忙的情況。
      security: [{ providerSignature: [] }]
      parameters:
        - name: provider
          in: path
          required: true
          description: 服務商代號。未註冊的服務商回 404。
          schema: { type: string }
          examples:
            mock: { value: "mock" }
      requestBody:
        required: true
        description: 服務商自訂的酬載（原始位元組，上限 64 KiB）。
        content:
          application/json:
            schema:
              type: object
              description: 形狀由各服務商決定。
      responses:
        "200":
          description: |
            已受理。JSON 形式（`mock` 等沒有自訂協定的服務商）：`ok` 表示狀態已
            更新，`ignored` 表示認不出這筆交易。純文字形式（`ecpay`）：`1|OK` 表示
            已受理，`0|…` 表示未受理。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, enum: [ok, ignored] }
            text/plain:
              schema:
                type: string
                description: 服務商自訂的確認字串。
                examples: ["1|OK", "0|CheckMacValue Error"]
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/webhooks/payments/{provider}/{shopID}:
    post:
      tags: [webhooks]
      operationId: paymentWebhookPerShop
      summary: 金流服務商回呼（憑證逐商家解析）
      description: |
        與 `POST /api/v1/webhooks/payments/{provider}` 完全相同的協定與回應形狀
        （見該端點），差別只在於本端點供**憑證逐商家解析**的服務商使用（目前只有
        `ecpay`）——驗簽前必須先知道要用哪個商家的密鑰，而這個值就是答案。

        **`{shopID}` 在驗簽通過之前不被信任**（change ecpay-per-shop-credentials，
        design D2）：它只決定「嘗試用哪個商家的密鑰驗證」，不是身分依據。用不屬於
        這筆通知的商家 id 呼叫本端點，後果是拿錯的密鑰去驗一個用別把密鑰算出來的
        簽章——**必然驗證失敗**，不會有任何資料因此被信任或外洩。真正的身分驗證
        仍然完全由服務商的簽章機制決定，與不帶 `{shopID}` 的端點逐字相同。

        `{shopID}` 由本 API 自己組進發起付款時提供給服務商的回呼位址——服務商只是
        原樣回傳，因此不需要服務商任何額外配合。
      security: [{ providerSignature: [] }]
      parameters:
        - name: provider
          in: path
          required: true
          description: 服務商代號。未註冊的服務商回 404。
          schema: { type: string }
          examples:
            ecpay: { value: "ecpay" }
        - name: shopID
          in: path
          required: true
          description: |
            供選擇驗簽密鑰用的商家 id——**驗簽通過前不被信任**，不是授權依據
            （見上方說明）。
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        description: 服務商自訂的酬載（原始位元組，上限 64 KiB）。
        content:
          application/json:
            schema:
              type: object
              description: 形狀由各服務商決定。
      responses:
        "200":
          description: |
            已受理，回應形狀同 `POST /api/v1/webhooks/payments/{provider}`
            （依 `{provider}` 決定 JSON 或純文字）。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, enum: [ok, ignored] }
            text/plain:
              schema:
                type: string
                description: 服務商自訂的確認字串。
                examples: ["1|OK", "0|CheckMacValue Error"]
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ═══════════════════════ 渲染 ═══════════════════════
  /api/v1/render/page:
    get:
      tags: [render]
      operationId: renderPage
      summary: 取得已發佈頁面的渲染 bundle
      description: |
        回傳用戶端無關的 SDUI bundle。**只回已發佈內容**（`published_json`），永不回草稿。

        租戶只由 `X-Publishable-Key` 決定（缺少、未知或已撤銷 → 404 `unknown_publishable_key`）。
        本端點不寫入、不簽發權杖、不接受任何已認證身分。
      security: []
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
        - name: path
          in: query
          required: false
          description: 訪客請求的原始路徑；省略即 `/`（對應保留 slug `home`）。
          schema: { type: string, default: "/" }
      responses:
        "200":
          description: 渲染 bundle。
          headers:
            X-Cache:
              description: 快取命中與否，供煙霧測試判讀。
              schema: { type: string, enum: [HIT, MISS] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderBundle' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/ShopDisabled' }

  /api/v1/render/preview:
    get:
      tags: [render]
      operationId: renderPreview
      summary: 以預覽權杖取得工作副本的渲染 bundle
      description: |
        回傳**工作副本**（`content_json`，即草稿），**完全不經過快取**。
        權杖由 `GET /api/v1/admin/shops/{shopID}/pages/{pageID}/preview-token` 簽發，
        且每次請求都會**重新確認**持有者當下仍具備該商家的 `page.view` 權限——
        撤權後舊權杖立即失效。
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: 短效預覽權杖。
          schema: { type: string }
      responses:
        "200":
          description: "工作副本的渲染 bundle（`Cache-Control: no-store`）。"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderBundle' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ═══════════════════════ 後台認證 ═══════════════════════
  /api/v1/admin/auth/login:
    post:
      tags: [admin-auth]
      operationId: adminLogin
      summary: 後台登入
      description: |
        失敗一律是同一個 401，**不區分**帳號不存在／密碼錯誤／帳號停用／尚未設定密碼。

        **帳號層級鎖定**（change admin-api-public-exposure）：同一個 email 在視窗內（預設 15
        分鐘）**跨所有來源 IP** 累計失敗達上限（預設 10）後，該 email 的登入一律回
        `429`＋`Retry-After`，**即使密碼正確**，直到視窗滑出；不存在的 email 行為完全相同。
        成功登入清除計數。代價是任何人可用錯誤密碼把某帳號鎖 15 分鐘。

        **`refresh_transport: "cookie"`**：refresh token 不放進回應主體，改以
        `Set-Cookie: __Secure-admin_refresh=…; HttpOnly; Secure; SameSite=Strict;
        Path=/api/v1/admin/auth; Max-Age=<refresh TTL>` 交付。僅適用於與 API **同源**的後台前端
        （跨源時 SameSite=Strict 的 cookie 不會被帶上，請用預設的 `body`）。

        **Cloudflare Access**：部署設定 `CF_ACCESS_TEAM_DOMAIN`／`CF_ACCESS_AUD` 後，所有
        `/api/v1/admin/*` 請求必須帶 Access 注入的 `Cf-Access-Jwt-Assertion`，否則 `403`
        （由 Cloudflare 於邊緣加上，瀏覽器端不需處理；因未設定時不需要，故不列為參數）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                refresh_transport:
                  type: string
                  enum: [body, cookie]
                  default: body
                  description: refresh token 的交付方式；省略＝`body`（行為與過去相同）。
      responses:
        "200":
          description: 登入成功。`cookie` 模式下回應不含 `refresh_token`，並帶 `Set-Cookie`。
          headers:
            Set-Cookie:
              description: 僅 `cookie` 模式：`__Secure-admin_refresh`（HttpOnly; Secure; SameSite=Strict）。
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { $ref: '#/components/responses/ValidationFailed' }
        "429": { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/auth/refresh:
    post:
      tags: [admin-auth]
      operationId: adminRefresh
      summary: 換發後台權杖
      description: |
        refresh token 一次性，成功後舊值立即失效。

        主體帶 `refresh_token` ＝ body 模式（行為不變）。主體未帶時改讀
        `__Secure-admin_refresh` cookie（cookie 模式），此時**必須**帶 `X-Admin-Refresh: 1`，
        否則 `401` 且 token **不會**被輪替；成功時以新 token 覆寫 cookie，回應不含 `refresh_token`。
      security: []
      parameters:
        - $ref: '#/components/parameters/AdminRefreshHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                refresh_token: { type: string, description: body 模式必填；cookie 模式省略。 }
      responses:
        "200":
          description: 換發成功。cookie 模式下回應不含 `refresh_token`，並以新值覆寫 cookie。
          headers:
            Set-Cookie:
              description: 僅 cookie 模式。
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "429": { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/auth/logout:
    post:
      tags: [admin-auth]
      operationId: adminLogout
      summary: 撤銷後台 refresh token
      description: |
        主體未帶 `refresh_token` 時改讀 cookie（cookie 模式），此時必須帶
        `X-Admin-Refresh: 1`（否則 `401`），並清除 cookie。
      security: []
      parameters:
        - $ref: '#/components/parameters/AdminRefreshHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                refresh_token: { type: string, description: body 模式必填；cookie 模式省略。 }
      responses:
        "204":
          description: 已撤銷。cookie 模式下同時清除 cookie。
          headers:
            Set-Cookie:
              description: 僅 cookie 模式：Max-Age=0 的 `__Secure-admin_refresh`。
              schema: { type: string }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/v1/admin/branding:
    get:
      tags: [admin-auth]
      operationId: getAdminBrandingByHost
      summary: 依請求的 admin 主機取得商家品牌（未認證）
      description: |
        共用後台 SPA 在**登入前**呼叫：伺服器以請求的 `Origin`（優先）或 `Host` 對照
        `purpose=admin` 的 origin 登記解析出商家，回傳名稱與品牌。主機未登記為任何商家的 admin
        origin 時回 `404`——前端改用平台預設外觀。洩漏面僅限於「知道該 admin 網域的人本來就看得到的
        登入頁內容」（change admin-api-public-exposure）。
      security: []
      responses:
        "200":
          description: 該 admin 主機所屬商家的名稱與品牌。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBrandingView' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/shops/{shopID}/branding:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
    get:
      tags: [admin-rbac]
      operationId: getShopAdminBranding
      summary: 取得商家的後台品牌
      description: |
        **不需要任何權限節點**，只需要已認證且通過跨店存取守衛（與 `/shops/{shopID}/me` 相同）；
        寫入走 `PUT /shops/{shopID}/settings` 的 `admin_branding`。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 商家名稱與品牌。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBrandingView' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/me:
    get:
      tags: [admin-auth]
      operationId: adminMe
      summary: 目前登入的後台使用者
      description: 帳號已被停用時回 401（即使 access token 尚未過期）。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 使用者與其可存取的商家清單。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, email, sids, platform_permissions]
                properties:
                  id: { type: integer }
                  email: { type: string }
                  platform_permissions:
                    type: array
                    items: { type: string }
                    description: |
                      平台層的有效權限節點（依名稱排序）；沒有平台角色者為 `[]`。**僅供介面可見性使用**，
                      伺服器端授權不讀它。
                  sids:
                    oneOf:
                      - type: array
                        items: { type: integer }
                      - type: 'null'
                    description: 該使用者具有成員資格的商家 id 集合。
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ═══════════════════════ 平台層：帳號與開店 (change platform-account-provisioning) ═══════════════════════
  /api/v1/admin/auth/password-setup/inspect:
    post:
      tags: [admin-auth]
      operationId: adminPasswordSetupInspect
      summary: 檢視密碼設定／重設連結
      description: |
        **未認證**，依來源 IP 限流。回傳 token 對應的帳號 email、種類與到期時間，**不消耗 token**。
        無效、過期、已使用的 token 一律是**同一個 404**（不區分原因）。
        連結形如 `{ADMIN_PUBLIC_URL}/#/set-password/{token}`，每個後台前端都必須在根路徑處理它，
        見 `docs/admin-frontend-integration.md`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: token 有效。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordSetupInspection' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/auth/password-setup:
    post:
      tags: [admin-auth]
      operationId: adminPasswordSetup
      summary: 以一次性連結設定後台密碼
      description: |
        **未認證**，依來源 IP 限流。密碼至少 12 字元（不足回 422，**且不消耗 token**）。
        成功後 token 立即失效，且該帳號全部 refresh token 被撤銷；**不會自動登入**，
        前端應導回登入頁。無效／過期／已使用的 token 一律 404。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12 }
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }
        "429": { $ref: '#/components/responses/TooManyRequests' }

  # ═══════════════════════ 商家成員管理 (change merchant-staff-role) ═══════════════════════
  /api/v1/admin/auth/invitations/inspect:
    post:
      tags: [admin-auth]
      operationId: adminInvitationInspect
      summary: 檢視成員邀請連結
      description: |
        **未認證**，依來源 IP 限流。回傳邀請的商家名稱、角色、受邀 email 與 `requires_login`，**不消耗 token**。
        `requires_login` 為 true 表示該 email 已有後台帳號：頁面必須要求登入後以已認證端點接受，
        邀請連結**永遠不能替既有帳號設定密碼**。這個布林讓持有連結者得知該 email 是否已有帳號
        （manual 交付下持有者就是邀請者；已知殘留，見 design D6）。
        無效、過期、已使用、已撤回的 token 一律是**同一個 404**。
        連結形如 `{ADMIN_PUBLIC_URL}/#/accept-invite/{token}`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: 邀請有效。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationInspect' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/auth/invitations/accept:
    post:
      tags: [admin-auth]
      operationId: adminInvitationAcceptAnonymous
      summary: 以新密碼接受成員邀請（僅限尚無後台帳號的 email）
      description: |
        **未認證**，依來源 IP 限流。**只有受邀 email 沒有任何後台帳號時才成功**：同一交易內建立帳號
        （密碼至少 12 字元，不足回 422 且不消耗 token）、成員資格與角色指派並消費邀請。
        該 email 已有帳號（不論是否已設定密碼）回 **409**、不做任何變更——請改以該帳號登入後呼叫
        `POST /api/v1/admin/invitations/accept`。無效／過期／已使用／已撤回一律 404。**不會自動登入。**
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12 }
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationFailed' }
        "429": { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/invitations/accept:
    post:
      tags: [admin-auth]
      operationId: adminInvitationAcceptAuthenticated
      summary: 以已登入帳號接受成員邀請
      description: |
        已認證、**不要求 RBAC 節點**（呼叫者尚不是受邀商家的成員；token 與 email 相等檢查就是授權）。
        呼叫者 email MUST 等於邀請 email，否則 403（邀請仍可由本人使用）。成功時呼叫者成為該商家的啟用成員並持有
        受邀角色，**密碼不變**。已是該店成員 409；無效／過期／已使用／已撤回 404。
        接受後前端應換發 token 使商家選單包含新商家。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/shops/{shopID}/invitations:
    post:
      tags: [admin-rbac]
      operationId: createShopInvitation
      summary: 邀請成員加入本店
      description: |
        需要商家層 `user.manage_members`，以「商家＋呼叫者」限流。`role_id` 必須是 `merchant_assignable = true`
        的商家層角色（商家呼叫者邀請 `merchant_owner` 回 422）。email 已是本店成員（啟用或停用）回 409。
        **不建立任何帳號。** 有效 7 天（`ADMIN_INVITE_TOKEN_TTL`）；同店同 email 的新邀請使舊的失效。

        **回應對「尚無帳號的 email」與「已有帳號的 email」鍵集合相同**。`delivery` 先看：
        `manual` 時含 `invite_url`（只顯示這一次，不可再取得）；日後改為 `email` 時**不回連結**。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role_id]
              properties:
                email: { type: string }
                role_id: { type: integer }
      responses:
        "201":
          description: 邀請已建立。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationCreated' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationFailed' }
        "429": { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [admin-rbac]
      operationId: listShopInvitations
      summary: 列出未接受的邀請（含已過期）
      description: |
        需要商家層 `user.manage_members`。列出本店**未接受、未撤回**的邀請，依建立時間遞減；
        每筆帶 `status`：`pending`（未過期）或 `expired`（已過期，連結已失效）。
        已過期者仍可用 `DELETE .../invitations/{invitationID}` 撤回（從清單移除）。
        舊版此端點只回未過期者；現在多回已過期的列，所有原有欄位不變，
        只新增 `status`——只認原有欄位的呼叫端必須改為依 `status` 過濾才能維持原本顯示。
        **不含 token 或連結。**
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
      responses:
        "200":
          description: 未接受的邀請（`status` 為 `pending` 或 `expired`）。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: '#/components/schemas/Invitation' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/shops/{shopID}/invitations/{invitationID}:
    delete:
      tags: [admin-rbac]
      operationId: revokeShopInvitation
      summary: 撤回邀請（含已過期）
      description: 需要商家層 `user.manage_members`。撤回後該連結視同無效（inspect 回 404），並從清單移除。待接受與已過期的邀請都可撤回；不是本店、已被接受或已撤回的邀請回 404。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: invitationID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/shops/{shopID}/users/{userID}/disable:
    post:
      tags: [admin-rbac]
      operationId: disableShopMembership
      summary: 停用成員在本店的成員資格
      description: |
        需要商家層 `user.manage_members`。變更的是**本店成員資格**（`shop_user.status`），**不是帳號**：
        該帳號在其他商家的權限不受影響。停用後該成員對本店的下一個請求即 403。
        不可停用自己（409）；商家層呼叫者不可停用持有不可委派角色的成員（403，例如另一位 owner）。
        非本店成員 404。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: userID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }
