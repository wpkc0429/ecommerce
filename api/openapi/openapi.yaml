# 多網站電商 SaaS — /api/v1 契約
#
# 這份檔案是手寫的，並由四道自動化檢查守著（design openapi-contract D1/D2）：
#
#   1. 路由覆蓋   internal/httpapi/openapi_contract_test.go   chi.Walk 雙向比對
#   2. 金額單位   同上                                        金額欄位必須 $ref MinorUnitAmount
#   3. 回應結構   internal/httpapi/openapi_conformance_integration_test.go
#   4. v1 表面鎖  同 1，比對 api/openapi/v1-surface.txt
#
# 全部住在 `go test ./...` 裡，因此自動在 CI 內執行。
# 改動任何端點時，這個檔案必須同步修改，否則 CI 轉紅。
openapi: 3.1.0

info:
  title: 多網站電商 SaaS API
  version: "1.0.0"
  summary: 多租戶電商 headless API：CMS 渲染、商品目錄、購物車、訂單、金流、物流、會員點數。
  description: |
    本 API 是整個平台唯一的資料權威。`/web`（Next.js SSR storefront）、`/admin`（薄殼 SPA）
    與任何商家自帶的前端都只是它的消費端。

    ## 版本策略

    公開端點一律掛在 `/api/v1`。**v1 只接受 additive 變更**：新增端點、新增選填請求鍵、
    新增回應鍵。移除或改名任何已公開的路徑或回應鍵都是破壞性變更，必須改走新端點或 `/api/v2`。
    這條規則由 `api/openapi/v1-surface.txt` 鎖檔機械化強制。

    消費端請對應地採取寬進策略：**忽略未知的回應鍵**。本文件的回應 schema 標示
    `additionalProperties: false`，那是為了讓契約測試抓得到「實作多回了一個沒記載的鍵」；
    它描述的是「截至本版本，回應有這些鍵」，**不是**「未來永遠只會有這些鍵」。

    ## 租戶解析（`/api/v1/shop/**`）

    前台端點不在 URL 裡帶 shop id。租戶**只**由 **`X-Publishable-Key`** 決定：金鑰未提供、未知、
    格式不符或已撤銷，一律回 **404**（`unknown_publishable_key`），沒有任何後備。
    （Host／網域對應與 `X-Site-Domain` 已隨託管店面一併移除，見 ADR 0002。）

    publishable key **是識別碼，不是憑證**（`pk_` + base32）：它公開、明文儲存、可完整顯示，
    只回答「你代表哪一家商家」，**不參與任何授權判定**。帶著它去打會員端點仍然是 401。
    它因此**不出現在下方的 Security Schemes**，而是一個一般的請求標頭參數。

    後台端點（`/api/v1/admin/**`）不做租戶解析：目標 shop 一律來自 URL 的 `{shopID}`，
    並由 RBAC 判定，**不信任任何 payload**。

    ## 錯誤格式

    所有錯誤回應共用同一個 envelope：`{"error": {"code", "message", "details"}}`。
    詳見 `Error` schema，其中列出全部已知的 `code`。

    **每一條端點都可能回 `500 internal`**，掛了速率限制的端點（後台登入／換發、會員註冊／登入／
    換發、訪客結帳）**可能回 `429 rate_limited`（附 `Retry-After` 標頭）**。
    為免淹沒真正有意義的資訊，端點層級只列出**呼叫端需要分辨並採取不同動作**的狀態碼。

    ## 安全地重送結帳（`Idempotency-Key`）

    兩條建立訂單的端點——`POST /api/v1/shop/checkout` 與 `POST /api/v1/shop/guest/checkout`
    ——都接受**選填**的 `Idempotency-Key` 標頭。**不帶時行為與過去完全相同**，它永遠不會變成必填。

    它解決的不是「顧客手滑點了兩次」（那個停用送出按鈕就能解決），而是**回應遺失**：
    連線斷掉或逾時的時候，前端無法分辨「請求根本沒送到」與「請求送到了、訂單建好了、
    只有回應在回程掉了」。這個分辨**只有伺服器做得到**——前端沒有訂單 id（那正是遺失的
    那個回應要帶回來的東西），而訪客也沒有可以拿去查訂單的 session。

    | 情形 | 回應 |
    | --- | --- |
    | 第一次 | `201` ＋ 訂單 |
    | 同 key、同主體重送 | `201` ＋ **同一筆**訂單 ＋ `Idempotency-Replayed: true` |
    | 同 key、**不同**主體 | `422 idempotency_key_reused` |
    | 同 key 的另一個請求還在跑 | `409 idempotency_key_in_progress`（稍後重試是安全的） |
    | key 格式不合 | `422 invalid_idempotency_key` |
    | **沒建成訂單的請求** | key **不被佔用**，可以立即修正後以同一把 key 重送 |

    回放**刻意無法從狀態碼或主體分辨**（那正是冪等的定義）；`Idempotency-Replayed` 標頭
    只是為了讓你驗證接線是否正確。細節與界限見 `IdempotencyKey` 參數。

    ## 金額

    所有金額皆為**最小貨幣單位的整數**，永不為浮點數，幣別由同層的 `currency`（ISO 4217）決定。
    見 `MinorUnitAmount`。**這是最容易出錯的一件事**：TWD 的最小貨幣單位是「元」，
    所以 `3400` 就是 NT$3,400；但若某天出現 USD，`340000` 才是 US$3,400.00。

    ## 已知的文件限制

    - 端點說明中提到的 **RBAC 權限節點是人工維護的敘述**，沒有自動化驗證。權威是
      `internal/httpapi/*.go` 的 `RequireShopPermission` / `RequirePlatformPermission` 呼叫。
    - `additionalProperties: false` 的意義見上方「版本策略」。
    - 契約與實作不一致時，**實作是權威**（除非實作違反了 `openspec/specs/` 的行為驗收）。
  contact:
    name: 契約與接入說明
    url: https://example.invalid/docs/storefront-integration.md
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: http://localhost:8080
    description: 本機開發（`make dev`）。前台端點的租戶由 `X-Publishable-Key` 決定。
  - url: "{scheme}://{host}"
    description: 任何部署。
    variables:
      scheme:
        default: https
        enum: [https, http]
      host:
        default: api.example.com
        description: API 的主機名稱。

tags:
  - name: health
    description: 健康檢查。
  - name: storefront-catalog
    description: 前台公開目錄（無認證，僅需租戶解析）。
  - name: storefront-auth
    description: 前台會員註冊／登入／換發／登出。
  - name: storefront-cart
    description: 會員購物車（會員 JWT）。
  - name: storefront-order
    description: 會員訂單、付款與出貨查詢（會員 JWT）。
  - name: storefront-points
    description: 會員點數與異動明細（會員 JWT）。
  - name: guest
    description: 訪客結帳與訂單存取 token 可觸及的端點。
  - name: webhooks
    description: 金流服務商回呼（簽章認證）。
  - name: render
    description: 渲染 bundle（SSR／原生 APP 消費的 SDUI 契約）。
  - name: admin-auth
    description: 後台登入／換發／登出。
  - name: admin-platform
    description: 平台層資源（網域、商家、主題、權限與角色目錄）。
  - name: admin-cms
    description: 商家層 CMS（頁面、全站內容、主題套用）。
  - name: admin-catalog
    description: 商家層目錄（分類、商品）。
  - name: admin-commerce
    description: 商家層交易（訂單、付款紀錄、運送方式、出貨、會員等級與點數）。
  - name: admin-client
    description: 商家層前端接入（publishable keys、允許的瀏覽器 origin）。
  - name: admin-media
    description: 商家層媒體（上傳意圖、商品圖片、CMS 內容圖片）。
  - name: admin-rbac
    description: 商家層使用者與角色指派。
  - name: public-application
    description: 平台官網的公開開店申請（無認證；Cloudflare Turnstile；CORS 只放行官網 origin）。
  - name: admin-applications
    description: 平台層開店申請審核（`shop_application.view`／`.review`，僅 super_admin）。

security: []

components:

  # ───────────────────────── securitySchemes ─────────────────────────
  #
  # 四種**互斥**的機制。publishable key 刻意不在此處 — 它是識別碼不是憑證，
  # 見 parameters/PublishableKey。
  securitySchemes:
    adminJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        後台存取權杖，`aud=admin`。由 `POST /api/v1/admin/auth/login` 或 `.../refresh` 取得。
        後台與前台是**兩套完全獨立的簽章金鑰與 audience**：會員權杖在此一律 401。

        失敗行為：無權杖／權杖無效／audience 不符 → **401**；通過認證但權限不足或跨商家存取 → **403**。
    memberJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        前台會員存取權杖，`aud=shop:{shopID}`。由 `POST /api/v1/shop/auth/{register,login,refresh}` 取得。

        **audience 綁定商家**：A 店簽發的權杖拿到 B 店（即租戶解析出不同的 shop）一律 **401**，
        即使 email 與密碼在兩店都存在——顧客身分以商家為界，兩者是互不相干的身分。

        必須在租戶已解析的前提下使用（即帶有效的 `X-Publishable-Key`）。
    orderAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        訂單存取權杖，`aud=order:{shopID}`。由 `POST /api/v1/shop/guest/checkout` 的回應取得，
        預設有效 24 小時。

        **它不是 session。** 明確的邊界：

        - 只能存取它**指名的那一筆訂單**；其路由**不接受路徑上的訂單 id**（沒有 id 可以竄改）。
        - **不能**列訂單歷史、**不能**取消訂單、**不能**換發或延長。
        - 拿它去打會員端點會得到 401（它不帶會員身分）。
        - 跨商家無效（audience 綁定 shop）。

        遺失即失效——顧客要再次取得訂單存取權，正確路徑是以同一個 email 註冊會員身分
        （見 `POST /api/v1/shop/auth/register` 的「認領」說明）。
    providerSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        金流服務商的回呼簽章。**實際的標頭名稱與演算法由各服務商決定**，此處的
        `X-Signature` 只是佔位；驗證由 `payment.Provider.VerifyWebhook` 對**原始位元組**執行。

        這是 `/api/v1/webhooks/payments/{provider}` 唯一的認證方式：該端點刻意掛在所有
        租戶／會員／後台中介層之外——呼叫者是服務商的伺服器，它不知道我們的網域配置，
        也沒有 JWT。簽章不符 → **401**。

  # ───────────────────────── parameters ─────────────────────────
  parameters:
    PublishableKey:
      name: X-Publishable-Key
      in: header
      required: false
      description: |
        **識別碼，不是憑證。** 宣告本次請求代表哪一家商家（`pk_` + base32）。

        - 公開值：明文儲存、後台可完整顯示、可以寫進前端原始碼與 git。
        - **不參與任何授權判定**：帶著它去打需要會員身分的端點仍然是 401。
        - 金鑰未提供、未知或已撤銷 → **404 `unknown_publishable_key`**，沒有任何後備
          （Host 與 `X-Site-Domain` 不再決定租戶）。
      schema:
        type: string
        pattern: '^pk_[a-z2-7]+$'
        examples: ["pk_demoseedstorefrontkeynotsecret"]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        **選填。** 帶上它，同一個請求就可以安全地重送——這是自帶前端唯一能回答
        「網路斷了，我的訂單到底成立了沒有」的方式。**不帶時行為與過去完全相同**
        （每次都建一筆新訂單）。

        - **值是不透明字串**：8–255 個可見 ASCII 字元。不要求 UUID，不解讀內容。
          太短會與同商家其他顧客相撞（後果是**對方**結不了帳），所以下限是硬性的。
        - **每一次結帳產生一把新的**，重試時沿用同一把。不要跨訂單重用、不要存進
          `localStorage` 忘了清。
        - **重試 MUST 送出逐位元組相同的請求主體。** 同一把 key 配上不同的主體會得到
          422 `idempotency_key_reused`——那代表「你改了內容卻沿用舊 key」。
        - **失敗不佔用 key**：驗證失敗、庫存不足、JSON 壞掉之後，同一把 key 可以立即
          修正重送（這正是「改好欄位再送一次」能運作的原因）。
        - 唯一性以**商家**為界，有效期預設 **24 小時**。

        回放時回應為 **201 ＋ 與第一次同構的主體**（刻意無法從狀態碼或主體分辨），
        並帶 `Idempotency-Replayed: true` 標頭供你驗證接線是否正確。
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: '^[\x21-\x7E]+$'
        examples: ["k-mfa3x1p-9qz2h7"]
    AdminRefreshHeader:
      name: X-Admin-Refresh
      in: header
      required: false
      description: |
        後台 **cookie 模式**的 refresh／logout **必須**帶 `1`（change admin-api-public-exposure
        design D5）。自訂標頭迫使跨源請求先做 preflight，而 preflight 只會對該商家自己的 admin
        origin 放行——擋住同站不同源（子網域）的 CSRF，這是 `SameSite=Strict` 單獨做不到的。
        body 模式不需要。
      schema: { type: string, examples: ["1"] }
    ShopIDPath:
      name: shopID
      in: path
      required: true
      description: 目標商家。後台的授權判定一律以這個值為準，不看任何 payload。
      schema: { type: integer, minimum: 1 }
    ShopApplicationIDPath:
      name: id
      in: path
      required: true
      description: 開店申請 id。
      schema: { type: integer, minimum: 1 }
    AccountUserIDPath:
      name: userID
      in: path
      required: true
      description: 目標後台帳號（`users.id`）。
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      required: false
      description: 第幾頁（從 1 起算）。缺漏或無法解析時使用伺服器預設，**不會回 400**。
      schema: { type: integer, minimum: 1 }
    PageSize:
      name: page_size
      in: query
      required: false
      description: 每頁筆數。缺漏或超出上限時由伺服器夾為預設值，**不會回 400**。
      schema: { type: integer, minimum: 1 }

  # ───────────────────────── 共用回應 ─────────────────────────
  responses:
    BadRequest:
      description: 請求本身無法解析（JSON 格式錯誤、body 過大、必要的查詢參數缺漏）。`code = bad_request`。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: |
        未認證或憑證無效。`code = unauthorized`。
        涵蓋：無 `Authorization` 標頭、權杖過期／簽章錯誤、audience 不符（跨商家重用）、
        以及帳號密碼錯誤——**登入失敗一律是同一個回應**，不區分帳號不存在／密碼錯誤／帳號停用。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 已認證但權限不足，或跨商家存取。`code = forbidden`。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: |
        資源不存在。`code = not_found`；**publishable key 無效時另有專屬的 `unknown_publishable_key`**，
        讓正在接入的商家能把「金鑰寫錯」與「這個頁面不存在」分開。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 與資源當下的狀態衝突（例如對已取消的訂單發起付款、對已出貨的訂單重複建立出貨）。`code = conflict`。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: |
        輸入通過了 JSON 解析但違反業務規則。`code = validation_failed`，
        `details` 是 **JSON Pointer 陣列**，指出**哪個欄位**錯了——這是前端最需要的資訊。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            shippingMethod:
              summary: 運送方式已被商家停用
              value:
                error:
                  code: validation_failed
                  message: "shipping method is not selectable"
                  details:
                    - pointer: /shipping_method_id
                      message: "unknown or inactive shipping method"
            giftMessage:
              summary: 第 2 個品項的卡片訊息超過 500 字元
              value:
                error:
                  code: validation_failed
                  message: "gift_message is too long"
                  details:
                    - pointer: /items/1/gift_message
                      message: "must be at most 500 characters"
    MediaNotConfigured:
      description: 媒體儲存（R2／MinIO）未設定。`code = media_not_configured`；路由照常存在，只是不可用。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: |
        超過速率限制。`code = rate_limited`，附 `Retry-After`（整數秒，最小 1）。
        僅適用於掛了限流的端點：後台登入／換發、會員註冊／登入／換發、訪客結帳。
      headers:
        Retry-After:
          description: 建議等待的秒數。
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ShopDisabled:
      description: 商家已被停用。`code = shop_disabled`。前台應呈現維護頁而非錯誤頁。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoContent:
      description: 成功，無回應主體。

  # ───────────────────────── schemas ─────────────────────────
  schemas:

    MinorUnitAmount:
      type: integer
      format: int64
      minimum: 0
      description: |
        **金額，以最小貨幣單位計的整數。永遠不是浮點數，永遠不是字串。**
        幣別由**同一層的 `currency`**（ISO 4217，三碼大寫）決定。

        - `TWD`：最小貨幣單位是「元」→ `3400` 表示 **NT$3,400**。
        - `JPY`：同理 → `3400` 表示 **¥3,400**。
        - `USD`：最小貨幣單位是「分」→ `340000` 表示 **US$3,400.00**。

        前端顯示時**不得**先除以 100——是否要除、除多少，取決於 `currency`。
        在單一 TWD 商家上，正確的顯示是把這個整數直接當作元。
      examples: [3400]

    ValidationDetail:
      type: object
      additionalProperties: false
      required: [pointer, message]
      description: 單一欄位的驗證錯誤位置。
      properties:
        pointer:
          type: string
          description: |
            指向出錯欄位的 JSON Pointer，相對於**請求主體**。
            巢狀與陣列同樣適用：`/items/1/gift_message`、`/shipping_address/phone`。
            少數與整體狀態有關的錯誤使用非欄位指標，例如 `/cart`（購物車是空的）。
          examples: ["/shipping_method_id", "/items/1/gift_message", "/shipping_address/phone", "/cart"]
        message:
          type: string
          description: 給開發者看的英文說明。**不適合直接顯示給終端使用者**。
          examples: ["unknown or inactive shipping method"]

    Error:
      type: object
      additionalProperties: false
      required: [error]
      description: |
        全 API 統一的錯誤 envelope。

        **已知的 `code` 全集**（狀態碼 → code → 意義）：

        | 狀態 | `code` | 意義 |
        | --- | --- | --- |
        | 400 | `bad_request` | JSON 無法解析、body 超過 1 MiB、必要查詢參數缺漏 |
        | 401 | `unauthorized` | 未認證、權杖無效／過期／audience 不符、登入失敗 |
        | 403 | `forbidden` | 已認證但權限不足，或跨商家存取 |
        | 404 | `not_found` | 資源不存在 |
        | 404 | `unknown_publishable_key` | publishable key 未提供、未知或已撤銷 |
        | 404 | `content_schema_not_found` | 商家尚未註冊內容 schema（或指定的版本不存在）；訊息附註冊端點 |
        | 405 | `method_not_allowed` | 路徑存在但不支援該方法 |
        | 409 | `conflict` | 與資源當下狀態衝突 |
        | 409 | `removals_require_confirmation` | 註冊的內容 schema 會丟棄既有內容的欄位或使文件失去 type；`details.report` 是相容性報告，確認後以 `confirm_removals=true` 重送 |
        | 422 | `validation_failed` | 業務規則驗證失敗，`details` 帶 JSON Pointer |
        | 422 | `registration_failed` | 註冊失敗（**刻意不說明原因**：不洩漏該 email 是否已是本店顧客） |
        | 422 | `checkout_unavailable` | 訪客結帳失敗（**刻意不說明原因**：該顧客已被商家停用） |
        | 413 | `payload_too_large` | 公開申請端點的 body 超過 16 KiB |
        | 503 | `verification_unavailable` | Turnstile 驗證服務暫時無法判定（**不放行**；稍後重試） |
        | 409 | `confirm_existing_account_required` | 核准申請時 owner email 已是後台帳號，需帶 `confirm_existing_account: true` |
        | 422 | `invalid_idempotency_key` | `Idempotency-Key` 不符 8–255 個可見 ASCII 字元 |
        | 422 | `idempotency_key_reused` | 同一把 `Idempotency-Key` 配上**不同的**請求（改了主體，或換了顧客／端點） |
        | 409 | `idempotency_key_in_progress` | 帶同一把 `Idempotency-Key` 的另一個請求仍在處理中，結果尚未確定。**稍後重試是安全的**（不附 `Retry-After`：那是限流專屬的標頭） |
        | 429 | `rate_limited` | 超過速率限制，附 `Retry-After` |
        | 500 | `internal` | 伺服器內部錯誤 |
        | 503 | `shop_disabled` | 商家已停用，前台應呈現維護頁 |
        | 503 | `unhealthy` | `/healthz` 的相依檢查失敗 |
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: 機讀的錯誤代碼。全集見上表。
              examples: ["validation_failed"]
            message:
              type: string
              description: 給開發者看的英文說明。**不適合直接顯示給終端使用者**。
            details:
              description: |
                補充資訊。`validation_failed` 時是 `ValidationDetail` 陣列；
                其餘 code 多半省略此鍵。
              oneOf:
                - type: array
                  items: { $ref: '#/components/schemas/ValidationDetail' }
                - type: object
                - type: 'null'

    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, examples: ["ok"] }

    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      description: |
        後台與前台共用的權杖回應形狀。

        `refresh_token` 是**一次性**的：每次換發都會旋轉，舊值立即失效。
        重複使用同一個 refresh token 會得到 401。

        **後台 cookie 模式**（登入時帶 `refresh_transport: "cookie"`）：回應**不含**
        `refresh_token`，refresh token 改以 `Set-Cookie: __Secure-admin_refresh` 交付
        （change admin-api-public-exposure）。預設（body）模式與過去逐位元組相同。
      properties:
        access_token:
          type: string
          description: "放進 `Authorization: Bearer <access_token>`。"
        refresh_token:
          type: string
          description: |
            只用於 `.../auth/refresh` 與 `.../auth/logout`。**一次性，用過即換新**。
            後台 cookie 模式下不出現。
        token_type: { type: string, examples: ["Bearer"] }
        expires_in:
          type: integer
          description: access token 的有效秒數。
          examples: [900]

    # ── 目錄 ──────────────────────────────────────────────────
    ProductSKU:
      type: object
      additionalProperties: false
      required: [id, sku_code, options, price_amount, currency, stock_qty, is_active]
      description: 商品的可購買單位。價格與庫存都掛在 SKU 上，不在商品上。
      properties:
        id: { type: integer }
        sku_code:
          type: string
          description: 商家自訂的料號，於同一商品內唯一。
          examples: ["BQ-ROSE-M"]
        options:
          type: object
          description: |
            以屬性名為鍵的選項值，例如 `{"size":"M"}`。內容由商家自由決定，平台不解讀。
            **是物件不是陣列**——永遠以已知的鍵查找，不依賴顯示順序。
          examples: [{ "size": "M" }]
        price_amount: { $ref: '#/components/schemas/MinorUnitAmount' }
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 三碼。`price_amount` 的單位由它決定。
          examples: ["TWD"]
        stock_qty:
          type: integer
          format: int32
          description: |
            目前庫存。**這是查詢當下的快照，不是保留**——真正的扣減發生在結帳的單一交易內
            （條件式扣減 + 受影響列數檢查），所以「看到有貨」不保證「結得成帳」。
        is_active:
          type: boolean
          description: 停用的 SKU 不可加入購物車也不可結帳（會回 422）。

    Product:
      type: object
      additionalProperties: false
      required: [id, shop_id, title, slug, subtitle, description, status, meta, updated_at, images]
      description: |
        商品。公開端點與後台端點回傳**同一個形狀**，差別只在公開端點僅回傳
        `status = 1`（已發佈）的商品。
      properties:
        id: { type: integer }
        shop_id: { type: integer }
        title: { type: string, examples: ["溫室玫瑰花束"] }
        slug:
          type: string
          description: 商家內唯一的網址片段，公開端點以它查詢單一商品。
          examples: ["greenhouse-rose-bouquet"]
        subtitle:
          type: string
          maxLength: 200
          description: |
            副標（商品卡片的第二行，例如英文品名）。語言中立；上限 200 字元，預設空字串。
          examples: ["Greenhouse Rose Bouquet"]
        description: { type: string }
        status:
          type: integer
          enum: [0, 1]
          description: "`0` 草稿（僅後台可見）／`1` 已發佈（公開端點可見）。"
        meta:
          type: object
          description: 商家自訂的附加資料（jsonb），平台不解讀。
        updated_at: { type: string, format: date-time }
        skus:
          type: array
          description: |
            SKU 集合，**依 `id` 遞增排序**（公開與後台一致）。
            列表端點與單一端點都會帶。
          items: { $ref: '#/components/schemas/ProductSKU' }
        category_ids:
          type: array
          description: 所屬分類 id，依分類 `position`、`id` 遞增。與 `categories` 是同一個集合。
          items: { type: integer }
        categories:
          type: array
          description: |
            `category_ids` 的展開（`{id, slug, name}`），同樣依分類 `position`、`id` 遞增。
            前台用它顯示分類名稱與連結，不必另外查分類樹。
          items: { $ref: '#/components/schemas/CategorySummary' }
        images:
          type: array
          description: |
            商品圖片，**依 `position`、`id` 遞增**。**永遠存在**：無圖片或媒體未設定時為 `[]`
            （不會缺鍵或為 `null`）。圖片是子資源，不能經由商品 PUT 修改。
          items: { $ref: '#/components/schemas/ProductImage' }

    ProductImage:
      type: object
      additionalProperties: false
      required: [id, alt, position, width, height, urls]
      description: |
        商品圖片。`urls` 於回應時由 `IMAGE_PUBLIC_BASE_URL` 與儲存鍵組成（資料庫只存鍵），
        內容不可變，可長期快取（`Cache-Control: immutable`）。
      properties:
        id: { type: integer }
        alt: { type: string, maxLength: 300 }
        position: { type: integer, minimum: 0 }
        width: { type: integer, description: "`large` 變體的實際寬度（像素）。" }
        height: { type: integer, description: "`large` 變體的實際高度（像素）。" }
        urls: { $ref: '#/components/schemas/ImageUrls' }

    ImageUrls:
      type: object
      additionalProperties: false
      required: [thumb, large]
      properties:
        thumb: { type: string, format: uri, description: 長邊 ≤ 480 的 WebP。 }
        large: { type: string, format: uri, description: 長邊 ≤ 1600 的 WebP。 }

    ProductImageList:
      type: object
      additionalProperties: false
      required: [images]
      properties:
        images:
          type: array
          items: { $ref: '#/components/schemas/ProductImage' }

    MediaUpload:
      type: object
      additionalProperties: false
      required: [upload_id, upload_url, headers, expires_at]
      properties:
        upload_id: { type: string, format: uuid }
        upload_url: { type: string, format: uri, description: Presigned PUT 網址（簽入 Content-Type 與 Content-Length）。 }
        headers:
          type: object
          additionalProperties: { type: string }
          description: PUT 時必須原樣帶上的標頭（至少 `Content-Type`）。
        expires_at: { type: string, format: date-time }

    ContentImage:
      type: object
      additionalProperties: false
      required: [urls, width, height]
      properties:
        urls: { $ref: '#/components/schemas/ImageUrls' }
        width: { type: integer }
        height: { type: integer }

    MediaConfig:
      type: object
      additionalProperties: false
      required: [enabled, public_base_url, max_bytes, accepted_types, max_images_per_product]
      properties:
        enabled: { type: boolean }
        public_base_url: { type: string, description: 影像網域（無結尾斜線）；未啟用時為空字串。 }
        max_bytes: { type: integer, description: 單檔位元組上限（預設 15 MiB）。 }
        accepted_types:
          type: array
          items: { type: string }
        max_images_per_product: { type: integer }

    ProductPage:
      type: object
      additionalProperties: false
      required: [products, page, page_size, total]
      properties:
        products:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        page: { type: integer }
        page_size: { type: integer }
        total:
          type: integer
          description: 符合條件的**總筆數**（不是金額）。

    Category:
      type: object
      additionalProperties: false
      required: [id, shop_id, parent_id, name, slug, position, updated_at]
      properties:
        id: { type: integer }
        shop_id: { type: integer }
        parent_id:
          oneOf: [{ type: integer }, { type: 'null' }]
          description: 上層分類；`null` 表示位於根層。
        name: { type: string }
        slug: { type: string }
        position: { type: integer, format: int32 }
        updated_at: { type: string, format: date-time }

    CategorySummary:
      type: object
      additionalProperties: false
      required: [id, slug, name]
      description: 商品回應中的分類摘要（刻意不含 `parent_id`／`children`，那是分類端點的事）。
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }

    CategoryProductOrder:
      type: object
      additionalProperties: false
      required: [products]
      description: 分類**直接**關聯的商品，依手動排序（`position`、`product_id`）。
      properties:
        products:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [product_id, title, status]
            properties:
              product_id: { type: integer }
              title: { type: string }
              status: { type: integer, enum: [0, 1], description: "`0` 草稿／`1` 已發佈。" }

    CategoryNode:
      type: object
      additionalProperties: false
      required: [id, parent_id, name, slug, position, children]
      description: 樹狀形式的分類（`GET .../categories` 的預設輸出）。
      properties:
        id: { type: integer }
        parent_id:
          oneOf: [{ type: integer }, { type: 'null' }]
        name: { type: string }
        slug: { type: string }
        position: { type: integer, format: int32 }
        children:
          type: array
          items: { $ref: '#/components/schemas/CategoryNode' }

    # ── 購物車 ────────────────────────────────────────────────
    CartItem:
      type: object
      additionalProperties: false
      required: [id, sku_id, sku_code, quantity, price_amount, currency, line_total, gift_message, purchasable, unavailable_reason]
      properties:
        id: { type: integer }
        sku_id: { type: integer }
        sku_code: { type: string }
        quantity: { type: integer, format: int32, minimum: 1 }
        price_amount:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: 加入購物車當下鎖定的單價快照，**不隨商家改價變動**。
        currency: { type: string, minLength: 3, maxLength: 3 }
        line_total:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: "`price_amount × quantity`。"
        gift_message:
          type: string
          maxLength: 500
          description: |
            卡片訊息，**永遠是字串、永不為 `null`**（沒有留言就是空字串）。
            上限 500 **字元**（以 rune 計，中英文一致）。

            **它是購物車品項的合併鍵的一部分**：同一個 SKU 配不同訊息是**兩列**，
            不是數量 2。前端的去重鍵必須把它算進去。
        purchasable:
          type: boolean
          description: 此列目前是否可結帳。為 `false` 時結帳會整筆失敗。
        unavailable_reason:
          type: string
          enum: ["", "sku_inactive", "product_unpublished", "insufficient_stock", "sku_deleted"]
          description: "`purchasable = false` 的原因；可購買時為空字串。"

    Cart:
      type: object
      additionalProperties: false
      required: [id, status, currency, items, subtotal, total, item_count]
      description: |
        會員的購物車。購物車是**暫存**：結帳成功後它的 `status` 變為 `1`（converted），
        下次加入品項會開一張新的。
      properties:
        id:
          oneOf: [{ type: integer }, { type: 'null' }]
          description: 尚未加入任何品項時為 `null`（此時購物車只是一個概念，沒有資料列）。
        status:
          type: integer
          enum: [0, 1, 2]
          description: "`0` 使用中／`1` 已轉為訂單／`2` 已放棄（保留值，本階段不產生）。"
        currency:
          oneOf: [{ type: string, minLength: 3, maxLength: 3 }, { type: 'null' }]
          description: |
            由**第一個加入的品項**鎖定，其後整車單一幣別。尚無資料列時為 `null`。
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        subtotal:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: Σ(`line_total`)。**不含運費**——運費要到結帳選定運送方式時才存在。
        total:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: 本階段等於 `subtotal`（購物車層沒有折扣與運費）。
        item_count:
          type: integer
          description: 品項**列數**（不是總數量）。

    # ── 訂單 ──────────────────────────────────────────────────
    ShippingAddress:
      type: object
      additionalProperties: false
      required: [recipient_name, phone, line1, city, postal_code, country]
      description: |
        訂單上的收件資訊（**回應形狀**）。所有鍵一律存在；沒填的欄位是**空字串而不是 `null`**
        （`line2` 為空時可能整個缺席）。

        請求端的形狀是 `ShippingAddressInput`，必填只有三個。
      properties:
        recipient_name: { type: string, examples: ["王小明"] }
        phone: { type: string, examples: ["0912345678"] }
        line1: { type: string, examples: ["台北市大安區復興南路一段 100 號 5 樓"] }
        line2: { type: string }
        city: { type: string }
        postal_code: { type: string }
        country: { type: string }

    ShippingAddressInput:
      type: object
      additionalProperties: false
      required: [recipient_name, phone, line1]
      description: |
        送出時的收件資訊。**必填只有 `recipient_name` / `phone` / `line1`**——
        台灣的單行地址本身就含縣市，強迫填 `country: "TW"` 只會製造儀式而非驗證。
        缺少必填欄位時 422，指標為 `/shipping_address/{field}`。
      properties:
        recipient_name: { type: string, examples: ["王小明"] }
        phone: { type: string, examples: ["0912345678"] }
        line1: { type: string, examples: ["台北市大安區復興南路一段 100 號 5 樓"] }
        line2: { type: string }
        city: { type: string }
        postal_code: { type: string }
        country: { type: string }

    OrderItem:
      type: object
      additionalProperties: false
      required: [id, product_id, product_title, sku_id, sku_code, options, quantity, price_amount, currency, line_total, gift_message, shipped_quantity]
      description: |
        訂單品項是**永久快照**：商品改名、改價、下架、刪除，都不會改變已成立訂單的顯示內容。
        唯一的例外是 `shipped_quantity`，它是狀態而不是快照。
      properties:
        id: { type: integer }
        product_id:
          oneOf: [{ type: integer }, { type: 'null' }]
          description: |
            **資訊性欄位，無外鍵**。商品被刪除後這個值可能指向不存在的列。
            呼叫端 **MUST NOT** 倚賴它能解析——顯示所需的一切已快照在本物件內。
        product_title:
          type: string
          description: 下單當下的商品標題快照。
        sku_id:
          oneOf: [{ type: integer }, { type: 'null' }]
          description: 同 `product_id`，資訊性、無外鍵、可能無法解析。
        sku_code: { type: string }
        options:
          oneOf:
            - type: object
              additionalProperties: { type: string }
            - type: 'null'
          description: |
            下單當下該 SKU 的規格選項快照（例如 `{"size":"M","color":"red"}`），與 `sku_code`
            同樣不受日後 SKU 編輯或刪除影響——客戶端不必再從 `sku_code` 尾碼猜尺寸。
            SKU 沒有任何選項時是 `{}`。**只有在此欄位出現之前成立的舊訂單可能是 `null`**
            （migration 已盡力以該 SKU 目前的選項回填；SKU 已刪除者維持 `null`），
            呼叫端 MUST 容許 `null`。
        quantity: { type: integer, format: int32, minimum: 1 }
        price_amount:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: 下單當下的單價快照。
        currency: { type: string, minLength: 3, maxLength: 3 }
        line_total:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: "`price_amount × quantity`。"
        gift_message:
          type: string
          maxLength: 500
          description: 卡片訊息快照，永遠是字串、永不為 `null`。
        shipped_quantity:
          type: integer
          format: int32
          minimum: 0
          description: |
            這一列已經出貨的數量（change partial-shipment），恆滿足 `0 <= shipped_quantity <= quantity`。
            這是**伺服器上的權威值**，也正是超量出貨防護所比對的那個數字；呼叫端 MUST NOT
            改以加總出貨紀錄自行推導，否則畫面上的「還能出幾件」會與伺服器實際接受的數量漂移。
            退貨**不會**使它回減。

    Order:
      type: object
      additionalProperties: false
      required:
        - id
        - shop_id
        - member_id
        - status
        - payment_status
        - fulfillment_status
        - currency
        - total_amount
        - subtotal_amount
        - discount_amount
        - discount_percent
        - member_tier_name
        - shipping_fee
        - shipping_method_id
        - shipping_method_name
        - requested_delivery_date
        - shipping_address
        - cancelled_at
        - items
        - created_at
        - updated_at
      description: |
        訂單。三個獨立的狀態軸（`status` / `payment_status` / `fulfillment_status`）互不取代。

        **金額由資料庫約束保證恆等**：
        `total_amount = subtotal_amount − discount_amount + shipping_fee`。
        呼叫端**不要自己算**——顯示與請款都用 `total_amount`。

        `discount_amount` 是**會員等級折扣**的折抵金額（見 `MemberTier.discount_percent`）。
        顧客結帳當下不屬於任何等級時它是 `0`，`discount_percent` 與 `member_tier_name` 為 `null`。
      properties:
        id: { type: integer }
        shop_id: { type: integer }
        member_id:
          type: integer
          description: |
            下單的顧客身分。訪客結帳也有：系統會為該 email 建立一個**無密碼身分**，
            日後以同一 email 註冊即「認領」它，訂單與點數自動浮現。
        status:
          type: integer
          enum: [0, 1]
          description: "`0` 已建立／`1` 已取消。"
        payment_status:
          type: integer
          enum: [0, 1, 2, 3]
          description: "`0` 未付款／`1` 已付款／`2` 已退款／`3` 部分退款（後兩者為保留值，本階段不產生）。"
        fulfillment_status:
          type: integer
          enum: [0, 1, 2, 3, 4]
          description: |
            `0` 未出貨／`1` 已出貨／`2` 已送達／`3` 已退回／`4` **部分出貨**。

            `4` 由 change partial-shipment 新增，`0`–`3` 的語意與數值一字未動。
            **呼叫端 MUST 對未知的值優雅降級**（顯示原始值或「未知」），MUST NOT 假設
            這個列舉已經封閉，也 MUST NOT 以 `<` / `>` 比較它——數值順序不再等於生命週期
            順序（`4` 是新增值，既有值的數值不可以移動）。

            這個欄位是**推導值**：沒有出貨→`0`；任一筆出貨已退貨→`3`；已出數量小於訂購
            數量→`4`；全部出貨皆已送達→`2`；其餘→`1`。逐筆包裹的精確狀態在出貨端點。
        currency: { type: string, minLength: 3, maxLength: 3 }
        total_amount:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: |
            **應付總額 ＝ `subtotal_amount` ＋ `shipping_fee`，也是向金流請款的金額。**
            前端顯示合計時**直接用這個值**，不要用品項自行加總——那樣會漏掉運費。
        subtotal_amount:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: |
            品項小計 ＝ Σ(`items[].line_total`)，**折扣前**。折扣不會改變這個值。
        discount_amount:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: |
            會員等級折扣的折抵金額，未套用折扣時為 `0`。**永不重算**：商家日後調整或刪除
            該等級、顧客升降級，都不會改變已成立訂單的這個值。

            計算方式（整數，**無條件捨去**）：`subtotal_amount × discount_percent / 100`。
            **只吃品項小計，運費不打折。**

            **點數以 `subtotal_amount − discount_amount`（實付商品金額）為基準核發，運費不計點。**
          examples: [340]
        discount_percent:
          oneOf: [{ type: integer }, { type: 'null' }]
          description: |
            結帳當下**實際套用**的折扣率快照。`null` 表示顧客當時不屬於任何等級；
            屬於一個沒有設定折扣的等級時為 `0`（兩者刻意可分辨）。
            **這是百分比不是金額。**
          examples: [10]
        member_tier_name:
          oneOf: [{ type: string }, { type: 'null' }]
          description: |
            折扣所依據的會員等級名稱快照，**不因日後改名或刪除而變動**。
            與 `discount_percent` 同時為 `null` 或同時非 `null`。
          examples: ["金卡會員"]
        shipping_fee:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: 結帳當下所選運送方式 `flat_rate` 的快照；未選運送方式時為 `0`。**永不重算**。
        shipping_method_id:
          oneOf: [{ type: integer }, { type: 'null' }]
          description: |
            **資訊性欄位，無外鍵**。商家刪除該運送方式後可能無法解析——
            對帳與顯示所需的 `shipping_method_name` 與 `shipping_fee` 已快照在此物件內。
        shipping_method_name:
          oneOf: [{ type: string }, { type: 'null' }]
          description: 運送方式名稱快照，**不因日後改名或刪除而變動**。
          examples: ["台北市當日配送"]
        requested_delivery_date:
          oneOf: [{ type: string, format: date }, { type: 'null' }]
          description: |
            顧客指定的配送日，**`YYYY-MM-DD` 的日曆日**（沒有時刻、沒有時區）。未指定為 `null`。
          examples: ["2026-08-05"]
        shipping_address: { $ref: '#/components/schemas/ShippingAddress' }
        cancelled_at:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OrderPage:
      type: object
      additionalProperties: false
      required: [orders, page, page_size, total]
      properties:
        orders:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        page: { type: integer }
        page_size: { type: integer }
        total:
          type: integer
          description: 符合條件的**總筆數**（不是金額）。

    MemberCheckoutRequest:
      type: object
      additionalProperties: false
      required: [recipient_name, phone, line1]
      description: |
        會員結帳的請求主體。**主體本身就是收件資訊**（平鋪），兩個訂單層選填鍵是它的兄弟鍵——
        這是既有形狀，刻意不改成巢狀（改了會打斷每一個既有呼叫端，只換到與訪客端點的外觀一致）。

        品項來自會員**目前的 active 購物車**，不在請求主體中。

        （這裡刻意把地址欄位寫開而不用 `allOf` 組合：`allOf` 的每個子 schema 各自套用自己的
        `additionalProperties: false`，於是任何一個鍵都會被另一個子 schema 判為多餘——
        那是一個看起來優雅但永遠驗不過的 schema。）
      properties:
        recipient_name: { type: string, examples: ["王小明"] }
        phone: { type: string, examples: ["0912345678"] }
        line1: { type: string, examples: ["台北市大安區復興南路一段 100 號 5 樓"] }
        line2: { type: string }
        city: { type: string }
        postal_code: { type: string }
        country: { type: string }
        shipping_method_id:
          oneOf: [{ type: integer }, { type: 'null' }]
          description: |
            由 `GET /api/v1/shop/shipping-methods` 取得的 `id`。**選填**：不送即免運
            （`shipping_fee = 0`）。不存在／屬於其他商家／已停用 → **422**，指標 `/shipping_method_id`，
            **訂單不會建立、庫存不會動**。
        requested_delivery_date:
          oneOf: [{ type: string, format: date }, { type: 'null' }]
          description: |
            **選填**，嚴格 `YYYY-MM-DD`。唯一的伺服器端規則是「不得是在任何時區都已過去的日期」
            （即不得早於 UTC 昨日）。**沒有**前置天數、截單時刻或最遠可預訂日——那些是商家自己的
            營業規則，要擋請在前端擋。格式錯誤或不存在的日期（如 `2026-02-31`）→ 422。
          examples: ["2026-08-05"]

    GuestCheckoutItem:
      type: object
      additionalProperties: false
      required: [sku_id, quantity]
      properties:
        sku_id: { type: integer }
        quantity: { type: integer, format: int32, minimum: 1 }
        gift_message:
          type: string
          maxLength: 500
          description: |
            選填。上限 500 **字元**（rune）。
            **同一個 `sku_id` 配不同訊息會成為兩個獨立品項**，前端不要先自行合併數量。

    GuestCheckoutRequest:
      type: object
      additionalProperties: false
      required: [email, items, shipping_address]
      properties:
        email:
          type: string
          format: email
          description: |
            訪客的 email。系統會在**本商家**找出或建立一個**無密碼身分**綁定這筆訂單。
            日後以同一 email 在本店註冊即「認領」該身分，歷史訂單與點數自動浮現。
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/GuestCheckoutItem' }
        shipping_address: { $ref: '#/components/schemas/ShippingAddressInput' }
        shipping_method_id:
          oneOf: [{ type: integer }, { type: 'null' }]
          description: 同 `MemberCheckoutRequest.shipping_method_id`。
        requested_delivery_date:
          oneOf: [{ type: string, format: date }, { type: 'null' }]
          description: 同 `MemberCheckoutRequest.requested_delivery_date`。

    GuestCheckoutResult:
      type: object
      additionalProperties: false
      required: [order]
      description: |
        訪客結帳成功的回應。

        **`order_access_token` 在極少數情況下可能缺席**：訂單已經成立但簽發權杖失敗時，
        伺服器仍回 201 並附上訂單（告訴顧客「你的訂單沒成立」才是更糟的謊）。
        前端必須容忍這個鍵不存在——此時顧客要查訂單，路徑是以同一 email 註冊。
      properties:
        order: { $ref: '#/components/schemas/Order' }
        order_access_token:
          type: string
          description: |
            放進 `Authorization: Bearer <token>` 存取 `/api/v1/shop/guest/order*`。
            **只能存取這一筆訂單**，不是 session（不能列訂單、不能取消、不能換發）。
        token_type: { type: string, examples: ["Bearer"] }
        expires_in:
          type: integer
          description: 有效秒數（預設 86400）。
          examples: [86400]

    # ── 金流 ──────────────────────────────────────────────────
    Payment:
      type: object
      additionalProperties: false
      required: [id, order_id, provider, provider_reference, provider_transaction_id, paid_at, amount, currency, status, created_at, updated_at]
      properties:
        id: { type: integer }
        order_id: { type: integer }
        provider:
          type: string
          description: 服務商代號，也是 webhook 路徑上的 `{provider}` 片段。
          examples: ["mock", "ecpay"]
        provider_reference:
          type: string
          description: |
            **我們產生**的交易識別碼，發起付款時就決定並送給服務商；webhook 以
            (`provider`, `provider_reference`) 做冪等查找。綠界流程中這是
            `MerchantTradeNo`（綠界後台顯示為「商店訂單編號」）。
        provider_transaction_id:
          oneOf: [{ type: string }, { type: 'null' }]
          description: |
            **服務商產生**的交易識別碼，只有在它的回呼送達後才會有值；服務商沒有
            第二個識別碼時恆為 `null`（例如 `mock`）。綠界流程中這是 `TradeNo`
            （綠界後台顯示為「綠界交易單號」）。

            人工對帳時商家手上拿到的可能是這兩個號碼中的任何一個，
            `GET /api/v1/admin/shops/{shopID}/payments` 的 `q` 兩個都接受。
          examples: ["2412311225437371"]
        paid_at:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
          description: |
            付款成功的時間。**付款成功（`status = 1`）的列一定有值**（change
            order-and-invitation-polish）：服務商有宣告就用它（綠界的 `PaymentDate`，
            也就是出現在對帳單上的那個時間）；沒有宣告（mock、或綠界略去 `PaymentDate`）
            則是平台記錄這次成功的時間。待付款與失敗的列為 `null`。此變更之前成功、
            卻沒有值的歷史列由 migration 以 `updated_at` 近似回填。

            這與 `updated_at` 不同且**不可互相替代**：`updated_at` 的定義是
            「這一列最後一次被寫入」，任何未來的寫入都會蓋掉它。
        amount:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: 請款金額，**等於訂單的 `total_amount`（含運費）**。本階段只支援全額付款。
        currency: { type: string, minLength: 3, maxLength: 3 }
        status:
          type: integer
          enum: [0, 1, 2, 3]
          description: "`0` 待付款／`1` 成功／`2` 失敗／`3` 已退款（保留值，本階段不產生）。"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PaymentRedirectForm:
      type: object
      additionalProperties: false
      required: [method, action, fields]
      description: |
        以**表單 POST** 把顧客送到服務商的收銀台。真實金流商（綠界的
        `AioCheckOut`）是把一組欄位 POST 過去，一個 URL 字串裝不下它。

        本 API 交付的是**欄位集，不是一段 HTML**：消費端不一定是瀏覽器
        （SSR、自帶靜態站、原生 APP 都在服務範圍內），而且 HTML 逸出應該發生在
        消費端自己的框架裡，不該由一個 JSON API 產生標記送進顧客的瀏覽器。

        照著做：建一個 `<form method>` 指向 `action` 的表單，`fields` 的每一組
        key/value 各放一個 hidden input，然後送出。
      properties:
        method:
          type: string
          enum: [POST]
        action:
          type: string
          description: 表單要送到的絕對網址。
          examples: ["https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5"]
        fields:
          type: object
          additionalProperties: { type: string }
          description: |
            表單欄位，名稱→值。**由服務商定義，本 API 不對它的內容做承諾**——
            綠界會隨方案增減欄位，逐一寫進契約等於把綠界的 API 版本鎖進我們的 v1。

            **金額欄位的單位在這裡宣告一次**：綠界的 `TotalAmount` 等於訂單的
            `total_amount`，同為最小貨幣單位的整數，**沒有任何換算**（TWD 的最小
            單位就是元）。此處無法以 `MinorUnitAmount` 表達（表單值型別上都是
            字串），守著它的是 Go 端的單元測試。
          examples:
            - MerchantID: "3002607"
              MerchantTradeNo: "O1234TMZQ8K3PA"
              TotalAmount: "3400"
              CheckMacValue: "6C51C9E6888DE861FD62FB1DD17029FC742634498FD813DC43D4243B5685B840"

    PaymentInitiateResult:
      type: object
      additionalProperties: false
      required: [id, order_id, provider, provider_reference, provider_transaction_id, paid_at, amount, currency, status, created_at, updated_at, redirect_url, redirect_form]
      description: 發起付款的回應：一筆 `Payment` 加上要把顧客導去的位置。
      properties:
        id: { type: integer }
        order_id: { type: integer }
        provider: { type: string }
        provider_reference: { type: string }
        provider_transaction_id:
          oneOf: [{ type: string }, { type: 'null' }]
          description: 發起付款當下必為 `null`——它由服務商在回呼時才產生。
        paid_at:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
          description: 發起付款當下必為 `null`。
        amount:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: 請款金額，等於訂單的 `total_amount`。
        currency: { type: string, minLength: 3, maxLength: 3 }
        status: { type: integer, enum: [0, 1, 2, 3] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        redirect_url:
          type: string
          description: |
            把顧客導向這個位置完成付款。付款結果**不會**經由這個轉導回來——
            權威是服務商送到 `/api/v1/webhooks/payments/{provider}` 的回呼。
            前端在轉導回來後應重新查詢訂單的 `payment_status`。

            **需要表單 POST 的服務商（如綠界）在這裡回空字串**——
            請先看 `redirect_form`。
        redirect_form:
          oneOf:
            - $ref: '#/components/schemas/PaymentRedirectForm'
            - type: 'null'
          description: |
            **消費端 MUST 先檢查這個欄位。** 它不是 `null` 時，`redirect_url`
            沒有意義，必須改用表單 POST。以 GET 導向 `action`（不帶欄位）
            會落在服務商的錯誤頁。

    PaymentPage:
      type: object
      additionalProperties: false
      required: [payments, page, page_size, total]
      properties:
        payments:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
        page: { type: integer }
        page_size: { type: integer }
        total:
          type: integer
          description: 符合條件的**總筆數**（不是金額）。

    # ── 物流 ──────────────────────────────────────────────────
    ShipmentItem:
      type: object
      additionalProperties: false
      required: [id, order_item_id, quantity]
      description: |
        一筆出貨所裝載的某個訂單品項與數量。

        刻意只有三個整數：顯示所需的一切（標題、SKU、單價、卡片訊息）已經是
        `OrderItem` 上的永久快照，`order_item_id` 直接對應 `Order.items[].id`，
        再抄一份只會多一份會漂移的序列化。**沒有任何金額欄位**——運費只存在於訂單層
        （`Order.shipping_fee`），出貨層若也有錢，同一筆交易就會有兩個權威。
      properties:
        id: { type: integer }
        order_item_id:
          type: integer
          description: 對應 `Order.items[].id`。
        quantity: { type: integer, format: int32, minimum: 1 }

    Shipment:
      type: object
      additionalProperties: false
      required: [id, order_id, carrier, tracking_number, status, shipped_at, delivered_at, items, created_at, updated_at]
      description: |
        一筆出貨（一個包裹）。**一張訂單可以有多筆**（change partial-shipment）。
        `items` 說明這個包裹裡裝了什麼。
      properties:
        id: { type: integer }
        order_id: { type: integer }
        carrier: { type: string, examples: ["黑貓宅急便"] }
        tracking_number:
          oneOf: [{ type: string }, { type: 'null' }]
        status:
          type: integer
          enum: [1, 2, 3]
          description: |
            `1` 已出貨／`2` 已送達／`3` 已退回。**沒有 `0`**——沒有出貨紀錄本身就等於未出貨
            （訂單的 `fulfillment_status = 0`）。**也沒有 `4`**：「部分」是訂單的性質，
            單一包裹永遠是完整的一個包裹。
        shipped_at:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        delivered_at:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        items:
          type: array
          description: |
            本包裹裝載的訂單品項與數量。**永遠存在、永遠是陣列**——整筆一次出貨的訂單
            會有一筆對應每個訂單品項，change partial-shipment 之前建立的出貨紀錄也已由
            資料遷移回填成這個形狀，所以呼叫端不必分辨「沒有品項」與「舊資料」。
          items: { $ref: '#/components/schemas/ShipmentItem' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ShippingMethod:
      type: object
      additionalProperties: false
      required: [id, shop_id, name, carrier, flat_rate, is_active, created_at, updated_at]
      description: 後台形狀的運送方式。
      properties:
        id: { type: integer }
        shop_id: { type: integer }
        name: { type: string, examples: ["台北市當日配送"] }
        carrier: { type: string, examples: ["自有車隊"] }
        flat_rate:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: 固定運費。結帳選定此方式時，這個值會被**複製**成訂單的 `shipping_fee`。
        is_active:
          type: boolean
          description: 停用的方式不出現在公開端點，且結帳選它會 422。
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PublicShippingMethod:
      type: object
      additionalProperties: false
      required: [id, name, carrier, flat_rate]
      description: |
        公開形狀的運送方式，**刻意小於後台形狀**：只回傳啟用中的方式，
        所以 `is_active` 沒有資訊量；時間戳是後台的簿記。
        v1 只能 additive，公開最小集合是唯一還能長大的方向。
      properties:
        id: { type: integer }
        name: { type: string, examples: ["台北市當日配送"] }
        carrier: { type: string, examples: ["自有車隊"] }
        flat_rate:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: 固定運費，幣別同商品。

    # ── 會員等級與點數 ─────────────────────────────────────────
    MemberTier:
      type: object
      additionalProperties: false
      required: [id, shop_id, name, min_points, discount_percent, created_at, updated_at]
      properties:
        id: { type: integer }
        shop_id: { type: integer }
        name: { type: string, examples: ["金卡"] }
        min_points:
          type: integer
          format: int32
          description: 達到此點數即進入本等級。**這是點數不是金額。**
        discount_percent:
          oneOf: [{ type: integer }, { type: 'null' }]
          description: |
            0–100 的折扣百分比。屬於本等級的顧客結帳時，系統會**自動套用**它：
            折抵金額 ＝ `subtotal_amount × discount_percent / 100`，整數運算、**無條件捨去**，
            **只吃品項小計，運費不打折**。`null` 或 `0` 皆表示不折扣。

            變更**立即**對其後建立的訂單生效，且**不影響任何既有訂單**——訂單上的
            `discount_percent` / `discount_amount` 是結帳當下的快照。**這是百分比不是金額。**
          examples: [10]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Member:
      type: object
      additionalProperties: false
      required: [id, shop_id, email, registered, status, points, level_id, level, created_at, updated_at]
      description: |
        後台顧客名冊上的一位顧客（change member-directory）。**這個 schema 的內容有一半是它的
        省略**，逐項理由見 design D3/D5/D6/D7：

        - **沒有 `password_hash`**，也沒有任何足以還原它的值。`registered` 是它唯一的布林投影。
        - **沒有 `phone`**：系統目前沒有任何寫入 `members.phone` 的路徑（註冊只收 email，訪客結帳
          刻意不寫入），交付一個恆為空的欄位會讓消費端以為它有值。顧客的聯絡電話在
          `Order.shipping_address` 裡——那才是它的語意（這一筆的收件電話）。日後真有 phone
          註冊路徑時，加回來是純 additive 的。
        - **沒有訂單筆數／累計消費金額**：口徑未定（含不含已取消、未付款、運費、折抵），而一個
          看起來權威的錯數字比沒有數字更有害。要看這位顧客買過什麼，用
          `GET /admin/shops/{shopID}/orders?member_id=…`。
      properties:
        id: { type: integer }
        shop_id: { type: integer }
        email:
          oneOf: [{ type: string, format: email }, { type: 'null' }]
        registered:
          type: boolean
          description: |
            這位顧客是否已設定密碼——等價於「他能不能登入」。`false` 代表這是訪客結帳自動建立的
            無密碼身分（change guest-checkout）：**這個人從未主動註冊、也從未同意成為任何名單的
            一員**，商家介面必須據此區分呈現，且不得把他當成已註冊會員。日後以同一 email 註冊
            （認領）之後會變成 `true`。
        status:
          type: integer
          description: '0 停用 / 1 啟用。停用的顧客無法登入，訪客結帳亦會被拒。'
        points:
          type: integer
          format: int32
          description: 目前點數餘額。**這是點數不是金額**，不得以任何貨幣格式呈現。
        level_id:
          oneOf: [{ type: integer }, { type: 'null' }]
        level:
          oneOf:
            - $ref: '#/components/schemas/MemberTier'
            - type: 'null'
          description: 目前等級的完整內容；尚未達到任何等級時為 `null`。
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MemberPage:
      type: object
      additionalProperties: false
      required: [members, page, page_size, total]
      properties:
        members:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        page: { type: integer }
        page_size:
          type: integer
          description: 實際每頁筆數。**上限 100**——這是名冊唯一的節流。
        total:
          type: integer
          description: 總筆數（不是金額，也不是點數）。

    MemberPoints:
      type: object
      additionalProperties: false
      required: [shop_id, member_id, points, level_id, level]
      properties:
        shop_id: { type: integer }
        member_id: { type: integer }
        points:
          type: integer
          format: int32
          description: 目前點數餘額。**這是點數不是金額。**
        level_id:
          oneOf: [{ type: integer }, { type: 'null' }]
        level:
          oneOf:
            - $ref: '#/components/schemas/MemberTier'
            - type: 'null'
          description: 目前等級的完整內容；尚未達到任何等級時為 `null`。

    PointTransaction:
      type: object
      additionalProperties: false
      required: [id, member_id, order_id, points_delta, kind, reason, created_at]
      properties:
        id: { type: integer }
        member_id: { type: integer }
        order_id:
          oneOf: [{ type: integer }, { type: 'null' }]
          description: 人工調整（`kind = 2`）時為 `null`；核發與扣回一定有值。
        points_delta:
          type: integer
          format: int32
          description: 有號的點數異動量。**這是點數不是金額。**
        kind:
          type: integer
          enum: [0, 1, 2]
          description: "`0` 訂單核發／`1` 訂單退貨扣回／`2` 人工調整。"
        reason: { type: string, examples: ["訂單付款回饋"] }
        created_at: { type: string, format: date-time }

    PointTransactionPage:
      type: object
      additionalProperties: false
      required: [transactions, page, page_size, total]
      properties:
        transactions:
          type: array
          items: { $ref: '#/components/schemas/PointTransaction' }
        page: { type: integer }
        page_size: { type: integer }
        total:
          type: integer
          description: 總筆數（不是金額，也不是點數）。

    # ── 前端接入 ──────────────────────────────────────────────
    PublishableKey:
      type: object
      additionalProperties: false
      required: [id, key, label, created_at, revoked_at]
      properties:
        id: { type: integer }
        key:
          type: string
          description: |
            **完整值，永遠不遮罩**——它是公開識別碼，遮罩只會妨礙正在接入的人而保護不了任何東西。
          examples: ["pk_demoseedstorefrontkeynotsecret"]
        label: { type: string, maxLength: 100 }
        created_at: { type: string, format: date-time }
        revoked_at:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
          description: |
            已撤銷的金鑰**仍留在列表中**：「那些流量用的是哪把金鑰、什麼時候切斷的」正是
            軟刪除要回答的問題。撤銷**立即生效**，不等快取過期。

    AllowedOrigin:
      type: object
      additionalProperties: false
      required: [id, origin, purpose, created_at]
      description: |
        允許以瀏覽器呼叫本 API 的 origin。CORS 的允許集合依**請求路徑與用途**而定
        （change admin-api-public-exposure）：非後台路徑 ＝ 平台環境變數清單 ∪
        `purpose=storefront`；`/api/v1/admin/shops/{id}/…` ＝ 平台清單 ∪ 登記於**該**商家的
        `purpose=admin`；`auth`／`me`／`branding`／`invitations/accept`／`media/config` ＝ 平台清單 ∪
        任一 `purpose=admin`；其他後台路徑（平台層）＝ 只有平台清單。
        storefront origin 在任何後台路徑上都不獲得 CORS。
        origin 是**全域競爭的命名空間**，所以登記需要平台層權限，不是商家自助。
      properties:
        id: { type: integer }
        origin:
          type: string
          description: "`scheme://host[:port]`，不含路徑、不含萬用字元。全域唯一（不分用途）。"
          examples: ["https://ondo.example.com"]
        purpose:
          type: string
          enum: [storefront, admin]
          description: |
            `storefront`＝商家自帶的店面前端（呼叫前台 API）；`admin`＝該商家的後台前端
            （只能呼叫該商家的後台路徑，且伺服器端以主機綁定限制為只能操作自己的店）。
            既有登記皆為 `storefront`。
        created_at: { type: string, format: date-time }

    # ── 後台：租戶與 CMS ───────────────────────────────────────
    Shop:
      type: object
      additionalProperties: false
      required: [id, name, status, content_json, meta, updated_at]
      properties:
        id: { type: integer }
        name: { type: string }
        status:
          type: integer
          enum: [0, 1, 2]
          description: "`0` 停用（前台回 503）／`1` 啟用／`2` 審核中（前台回 404）。"
        content_json:
          type: object
          description: 全站內容，依當前主題的 `config_schema` 驗證。schema 中 `x-editor` 標註為 `richtext` 的字串欄位於寫入時依單一 allowlist 消毒（改寫而非拒絕），回應為實際儲存的值。
        meta:
          type: object
        updated_at: { type: string, format: date-time }

    # ── 商家成員邀請 (change merchant-staff-role) ──────────────────
    InvitationCreated:
      type: object
      additionalProperties: false
      description: |
        邀請的交付結果。**`delivery` 必填，消費端 MUST 先看它**；`manual` 才有 `invite_url`（只顯示這一次）。
        對「新 email」與「已有帳號的 email」鍵集合相同。
      required: [invitation_id, delivery, expires_at]
      properties:
        invitation_id: { type: integer }
        delivery: { type: string, enum: [manual, email] }
        invite_url: { type: string, description: "形如 `{ADMIN_PUBLIC_URL}/#/accept-invite/{token}`（僅 manual）。" }
        expires_at: { type: string, format: date-time }

    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role_id, role_name, status, expires_at, created_at]
      properties:
        id: { type: integer }
        email: { type: string }
        role_id: { type: integer }
        role_name: { type: string }
        status:
          type: string
          enum: [pending, expired]
          description: '`pending` 尚可接受；`expired` 已過期（連結失效），仍可撤回。'
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    InvitationInspect:
      type: object
      additionalProperties: false
      required: [shop_name, role_name, email, requires_login, expires_at]
      properties:
        shop_name: { type: string }
        role_name: { type: string }
        email: { type: string }
        requires_login:
          type: boolean
          description: 該 email 已有後台帳號——必須登入後以已認證端點接受。
        expires_at: { type: string, format: date-time }

    # ── 帳號與開店 (change platform-account-provisioning) ──────────────
    PasswordSetupInspection:
      type: object
      additionalProperties: false
      required: [email, kind, expires_at]
      properties:
        email: { type: string }
        kind: { type: string, enum: [setup, reset] }
        expires_at: { type: string, format: date-time }

    CredentialLink:
      type: object
      description: |
        一次性密碼連結的交付結果。**`delivery` 必填，消費端 MUST 先看它**：
        `manual` 表示連結在這份回應裡（`setup_url` 或 `reset_url`，只顯示這一次）；
        `email` 表示已寄出，**回應不含連結**。
      required: [delivery, expires_at]
      properties:
        delivery: { type: string, enum: [manual, email] }
        setup_url: { type: string, description: 新帳號的設定連結（僅 manual）。 }
        reset_url: { type: string, description: 重設連結（僅 manual）。 }
        expires_at: { type: string, format: date-time }

    AccountCreated:
      allOf:
        - $ref: '#/components/schemas/CredentialLink'
        - type: object
          required: [user_id, email]
          properties:
            user_id: { type: integer }
            email: { type: string }

    AccountResetLink:
      allOf:
        - $ref: '#/components/schemas/CredentialLink'
        - type: object
          required: [user_id]
          properties:
            user_id: { type: integer }

    Account:
      type: object
      additionalProperties: false
      required: [id, email, status, has_password, created_at]
      properties:
        id: { type: integer }
        email: { type: string }
        status: { type: integer, enum: [0, 1], description: "`0` 停用／`1` 啟用。" }
        has_password: { type: boolean, description: 密碼是否已設定（未設定者無法登入）。 }
        created_at: { type: string, format: date-time }

    AccountPage:
      type: object
      additionalProperties: false
      required: [accounts, page, page_size, total]
      properties:
        accounts:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    AccountRoleRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    AccountDetail:
      type: object
      additionalProperties: false
      required: [id, email, status, has_password, created_at, memberships, platform_roles]
      properties:
        id: { type: integer }
        email: { type: string }
        status: { type: integer, enum: [0, 1] }
        has_password: { type: boolean }
        created_at: { type: string, format: date-time }
        memberships:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [shop_id, shop_name, roles]
            properties:
              shop_id: { type: integer }
              shop_name: { type: string }
              roles:
                type: array
                items: { $ref: '#/components/schemas/AccountRoleRef' }
        platform_roles:
          type: array
          items: { $ref: '#/components/schemas/AccountRoleRef' }

    ProvisionResult:
      type: object
      additionalProperties: false
      required: [shop, owner, storefront_origins]
      properties:
        shop: { $ref: '#/components/schemas/Shop' }
        owner:
          type: object
          description: |
            `created` 為 false（既有帳號被加入）時沒有 `delivery`／`setup_url`／`expires_at`，且其密碼不變。
          required: [user_id, email, created]
          properties:
            user_id: { type: integer }
            email: { type: string }
            created: { type: boolean }
            delivery: { type: string, enum: [manual, email] }
            setup_url: { type: string }
            expires_at: { type: string, format: date-time }
        storefront_origins:
          type: array
          items: { type: string }

    ShopApplicationSubmit:
      type: object
      description: 公開申請請求。未知欄位被忽略。
      required: [email, contact_name, shop_name, business_summary, consent_version, turnstile_token]
      properties:
        email: { type: string, maxLength: 254 }
        contact_name: { type: string, minLength: 1, maxLength: 100 }
        shop_name: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: string, maxLength: 20, pattern: '^[0-9+() -]*$' }
        business_summary: { type: string, minLength: 1, maxLength: 1000 }
        consent_version: { type: string, maxLength: 32, description: 必須等於 API 目前的條款版本（`APPLICATION_CONSENT_VERSION`）。 }
        turnstile_token: { type: string, maxLength: 2048 }
        website: { type: string, maxLength: 0, description: honeypot：真人看不到，必須為空字串或省略。 }
        elapsed_seconds: { type: number, minimum: 0, description: 表單載入到送出的秒數；低於 3 只加審核旗標。 }

    ShopApplicationReceived:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [received] }

    ShopApplicationVerified:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [verified] }

    ShopApplicationApprove:
      type: object
      properties:
        shop_name: { type: string, description: 覆寫申請者填的店名。 }
        status: { type: integer, enum: [0, 1, 2], description: 新商家的狀態；省略＝2（審核中，店面不可達）。 }
        confirm_existing_account: { type: boolean, description: owner email 已是後台帳號時必填 true。 }

    ShopApplicationReject:
      type: object
      required: [decision_reason]
      properties:
        decision_reason: { type: string, minLength: 1, maxLength: 1000, description: 對申請者可見。 }
        internal_note: { type: string, maxLength: 2000, description: 僅內部。 }

    ShopApplication:
      type: object
      additionalProperties: false
      required: [id, status, email, email_verified, email_verified_at, contact_name, shop_name, risk_flags, reviewed_by, reviewed_at, provisioned_shop_id, purged, created_at]
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending_verification, pending_review, approved, rejected, expired, withdrawn] }
        email: { type: string, description: 個資清除後為空字串。 }
        email_verified: { type: boolean }
        email_verified_at: { type: [string, "null"], format: date-time }
        contact_name: { type: string }
        shop_name: { type: string }
        risk_flags:
          type: object
          description: 不含個資的布林旗標：`filled_too_fast`、`email_has_account`、`manually_verified`。
          additionalProperties: { type: boolean }
        reviewed_by: { type: [integer, "null"] }
        reviewed_at: { type: [string, "null"], format: date-time }
        provisioned_shop_id: { type: [integer, "null"] }
        purged: { type: boolean, description: 個資是否已被保存期限清除。 }
        created_at: { type: string, format: date-time }
        phone: { type: string }
        business_summary: { type: string }
        consent_version: { type: string }
        consented_at: { type: string, format: date-time }
        decision_reason: { type: string }
        internal_note: { type: string }

    ShopApplicationList:
      type: object
      additionalProperties: false
      required: [items, total, counts, pending_messages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ShopApplication' }
        total: { type: integer }
        counts:
          type: object
          description: 全表各狀態的筆數。
          additionalProperties: { type: integer }
        pending_messages: { type: integer, description: 待人工寄出（`pending_manual`）或失敗（`failed`）的 outbox 訊息數。 }

    ShopApplicationEvent:
      type: object
      additionalProperties: false
      required: [id, event, actor_user_id, detail, created_at]
      properties:
        id: { type: integer }
        event: { type: string }
        actor_user_id: { type: [integer, "null"] }
        detail: { type: [object, "null"], description: 不含 email、姓名、電話。 }
        created_at: { type: string, format: date-time }

    ShopApplicationMessage:
      type: object
      additionalProperties: false
      required: [id, kind, recipient_email, subject, body_text, delivery, status, error_reason, created_at, sent_at, marked_by]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [verify_email, approved, rejected] }
        recipient_email: { type: string }
        subject: { type: string }
        body_text: { type: string }
        delivery: { type: string, enum: [manual, email] }
        status: { type: string, enum: [pending_manual, queued, sent, failed] }
        error_reason: { type: string }
        created_at: { type: string, format: date-time }
        sent_at: { type: [string, "null"], format: date-time }
        marked_by: { type: [integer, "null"] }

    ShopApplicationDetail:
      allOf:
        - $ref: '#/components/schemas/ShopApplication'
        - type: object
          required: [email_has_account, events, messages]
          properties:
            email_has_account: { type: boolean }
            events:
              type: array
              items: { $ref: '#/components/schemas/ShopApplicationEvent' }
            messages:
              type: array
              items: { $ref: '#/components/schemas/ShopApplicationMessage' }

    ShopApplicationApproved:
      type: object
      additionalProperties: false
      required: [application, shop, owner]
      properties:
        application: { $ref: '#/components/schemas/ShopApplication' }
        shop: { $ref: '#/components/schemas/Shop' }
        owner:
          type: object
          description: |
            `created` 為 false（既有帳號被加入）時沒有 `delivery`／`setup_url`／`expires_at`，且其密碼不變。
          required: [user_id, email, created]
          properties:
            user_id: { type: integer }
            email: { type: string }
            created: { type: boolean }
            delivery: { type: string, enum: [manual, email] }
            setup_url: { type: string }
            expires_at: { type: string, format: date-time }

    SetupStatus:
      type: object
      additionalProperties: false
      required: [shop_id, owner_assigned, owner_password_set, home_published, shipping_method_active, payment_credentials_set, publishable_key_active]
      properties:
        shop_id: { type: integer }
        owner_assigned: { type: boolean }
        owner_password_set: { type: boolean }
        home_published: { type: boolean }
        shipping_method_active: { type: boolean }
        payment_credentials_set: { type: boolean }
        publishable_key_active: { type: boolean }

    # ── 商家設定與時區 (change merchant-reports) ──────────────
    EffectiveTimezone:
      type: object
      additionalProperties: false
      required: [name, source]
      description: |
        某次查詢實際用來切「一天」的時區，以及它從哪裡來。

        **`source` 不是裝飾。** 「這家商家選了 Asia/Taipei」與「這家商家什麼都沒選、
        而平台預設剛好是 Asia/Taipei」算出來的數字一模一樣，但它們是兩件不同的事實：
        只有後者應該讓一個開在東京的商家停下來去設定它。介面 MUST 如實標示這件事。
      properties:
        name:
          type: string
          description: IANA 時區名稱。
          examples: ["Asia/Taipei"]
        source:
          type: string
          enum: [shop, default]
          description: |
            `shop` ＝ 商家自己設定的；`default` ＝ 商家未設定，回落到平台的
            `REPORT_DEFAULT_TIMEZONE`。

    ShopSettings:
      type: object
      additionalProperties: false
      required: [shop_id, timezone, effective_timezone, admin_branding]
      description: 商家自己可維護的設定：時區與後台品牌。
      properties:
        admin_branding: { $ref: '#/components/schemas/AdminBranding' }
        shop_id: { type: integer }
        timezone:
          oneOf: [{ type: string }, { type: 'null' }]
          description: |
            **儲存的原始值**：商家從未設定過時為 `null`。這與 `effective_timezone.name`
            不同——後者是套用回落之後、報表實際使用的值。
          examples: ["Asia/Taipei"]
        effective_timezone: { $ref: '#/components/schemas/EffectiveTimezone' }

    AdminBranding:
      type: object
      additionalProperties: false
      required: [logo_url, primary_color, accent_color]
      description: |
        商家共用後台 SPA 的品牌（change admin-api-public-exposure）。純資料：API 不依前端
        身分分支，自訂的後台前端可以完全忽略它。三個欄位恆存在，`""` ＝ 未設定。
      properties:
        logo_url: { type: string, description: "絕對 http(s) URL；媒體已設定時必須位於影像網域。" }
        primary_color: { type: string, description: "`#rrggbb`（小寫）。", examples: ["#1a73e8"] }
        accent_color: { type: string, description: "`#rrggbb`（小寫）。", examples: ["#ff6d00"] }

    AdminBrandingView:
      type: object
      additionalProperties: false
      required: [name, branding]
      properties:
        shop_id: { type: integer, description: "只在已認證的 `/shops/{shopID}/branding` 出現。" }
        name: { type: string, description: 商家名稱。 }
        branding: { $ref: '#/components/schemas/AdminBranding' }

    # ── 每商家金流憑證 (change ecpay-per-shop-credentials) ────
    ECPayCredentials:
      type: object
      additionalProperties: false
      required: [shop_id, provider, configured]
      description: |
        商家自己的 ECPay（綠界）憑證狀態。**`hash_key`／`hash_iv` 從不出現在這裡**
        （設計 D3/D6）——它們是真正的密鑰，只寫不讀；本物件只回報「是否已設定」。
      properties:
        shop_id: { type: integer }
        provider: { type: string, enum: [ecpay] }
        configured:
          type: boolean
          description: 此商家是否已設定過 ecpay 憑證。為 `false` 時以下欄位不存在。
        merchant_id:
          type: string
          description: 綠界商店代號——識別碼而非密鑰，可明文顯示（同 publishable key 的區分）。
        choose_payment:
          oneOf: [{ type: string }, { type: 'null' }]
          description: 綠界 `ChoosePayment`。`null` 表示沿用 provider 內建的 `Credit` 預設。
        hash_key_configured: { type: boolean, description: 是否已設定 HashKey（從不回傳其值）。 }
        hash_iv_configured: { type: boolean, description: 是否已設定 HashIV（從不回傳其值）。 }
        updated_at: { type: string, format: date-time }

    # ── 營運報表 (change merchant-reports) ────────────────────
    ReportAmounts:
      type: object
      additionalProperties: false
      required:
        [order_count, subtotal_amount, discount_amount, net_amount, shipping_fee, total_amount,
         returned_order_count, returned_total_amount, cancelled_order_count, unpaid_order_count]
      description: |
        一組數字，同時包含**金額**與**對帳分割**。

        **口徑（計入營業額的訂單）**：未取消（`status = 0`）**且**已付款
        （`payment_status = 1`）**且**未退貨（`fulfillment_status ≠ 3`）。

        - 已取消不計：取消會歸還庫存並扣回點數，系統已視為未發生。
        - 未付款不計：未付款的訂單可能永遠不會付，計入會讓報表恆定高於實收金額。
        - 已退貨不計入金額，但**單獨呈現**（`returned_*`）——「這個月退了三筆」正是
          商家最需要看見的一件事，藏起來就是報表開始粉飾的第一步。

        **時間軸是訂單建立時間**，不是付款時間也不是出貨時間。**因此這份報表不是
        現金流量表**，介面必須說出這句話。

        **對帳分割**：`order_count ＋ returned_order_count ＋ cancelled_order_count
        ＋ unpaid_order_count` **等於**該期間內建立的全部訂單筆數。四類互斥（依序判定，
        已取消的訂單必然也未付款，但只計一次），所以商家可以拿訂單列表的總筆數自行驗證
        這份報表，而不是只能相信它。

        **金額不縮減成單一「營業額」**：`subtotal_amount − discount_amount = net_amount`，
        `net_amount + shipping_fee = total_amount`。`total_amount` 的語意在 change
        order-extras 改過、其組成在 change tier-discount-application 又被插入折抵——
        組合式呈現是商家唯一能察覺這兩件事的地方。

        **本端點不產出任何需要除法的數字**（平均客單價、比率、成長率）：除法需要一個
        捨入方向，而全系統只有一種捨入。`order_count` 與 `total_amount` 都在這裡，
        要平均的人可以自己除。
      properties:
        order_count:
          type: integer
          description: 計入營業額的訂單筆數。**這是筆數不是金額**，介面不得以貨幣格式呈現。
        subtotal_amount:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: 品項小計合計（折扣前）。
        discount_amount:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: 等級折扣合計。
        net_amount:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: 商品淨額 ＝ `subtotal_amount − discount_amount`。
        shipping_fee:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: 運費合計。**運費不打折、不計點、不計入商品排行。**
        total_amount:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: 應付總額合計 ＝ `net_amount + shipping_fee`，即實際請款的金額。
        returned_order_count:
          type: integer
          description: 已付款後被標記退貨的訂單筆數。**不含在 `order_count` 內。**
        returned_total_amount:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: 上述退貨訂單的應付總額合計。
        cancelled_order_count:
          type: integer
          description: 期間內建立且已取消的訂單筆數。
        unpaid_order_count:
          type: integer
          description: 期間內建立、未取消、但尚未付款的訂單筆數。

    SalesBucket:
      type: object
      additionalProperties: false
      required:
        [period, order_count, subtotal_amount, discount_amount, net_amount, shipping_fee, total_amount,
         returned_order_count, returned_total_amount, cancelled_order_count, unpaid_order_count]
      description: 一個商家當地日（或當地月）的數字。欄位語意與 `ReportAmounts` 完全相同。
      properties:
        period:
          type: string
          format: date
          description: |
            **商家當地的日曆日**（`YYYY-MM-DD`），不是時間戳。`group_by=month` 時為該月的第一天，
            所以兩種分組只有一種形狀，消費端不必解析兩種格式。

            刻意不回傳完整時間戳：那會誘使消費端對一個**已經套用過偏移量**的值再套一次，
            而那正是本端點存在的意義所在（與 `requested_delivery_date` 同一個理由）。
          examples: ["2026-08-01"]
        order_count: { type: integer }
        subtotal_amount: { $ref: '#/components/schemas/MinorUnitAmount' }
        discount_amount: { $ref: '#/components/schemas/MinorUnitAmount' }
        net_amount: { $ref: '#/components/schemas/MinorUnitAmount' }
        shipping_fee: { $ref: '#/components/schemas/MinorUnitAmount' }
        total_amount: { $ref: '#/components/schemas/MinorUnitAmount' }
        returned_order_count: { type: integer }
        returned_total_amount: { $ref: '#/components/schemas/MinorUnitAmount' }
        cancelled_order_count: { type: integer }
        unpaid_order_count: { type: integer }

    SalesReportCurrency:
      type: object
      additionalProperties: false
      required: [currency, summary, buckets]
      description: 單一幣別的**完整且自足**的報表。
      properties:
        currency:
          type: string
          description: ISO 4217 三碼大寫。
          examples: ["TWD"]
        summary: { $ref: '#/components/schemas/ReportAmounts' }
        buckets:
          type: array
          description: 依 `period` 遞增排序。沒有任何訂單的日／月不會出現（不補零列）。
          items: { $ref: '#/components/schemas/SalesBucket' }

    SalesReport:
      type: object
      additionalProperties: false
      required: [shop_id, from, to, group_by, timezone, currencies]
      description: |
        期間營業額報表。

        **多幣別不會被加總，而且是結構上做不到的**：`currencies` 是最外層的維度，
        這份回應裡**沒有任何地方**可以放一個跨幣別的總額。替代方案（回一個總額
        ＋ 一個「本期含多種幣別」的旗標）要求每一個消費端都記得檢查那個旗標，
        而遲早會有一個忘記。
      properties:
        shop_id: { type: integer }
        from:
          type: string
          format: date
          description: 期間起日（商家當地日，**包含**）。
        to:
          type: string
          format: date
          description: 期間迄日（商家當地日，**包含**）。
        group_by:
          type: string
          enum: [day, month]
          description: 實際採用的分組粒度（原樣回傳，消費端不必猜伺服器的預設值）。
        timezone: { $ref: '#/components/schemas/EffectiveTimezone' }
        currencies:
          type: array
          description: 依幣別代碼遞增排序。期間內沒有任何訂單時為空陣列。
          items: { $ref: '#/components/schemas/SalesReportCurrency' }

    ProductSalesRow:
      type: object
      additionalProperties: false
      required: [product_title, sku_code, quantity, gross_amount]
      description: |
        商品銷售排行的一列。

        **分組鍵是訂單品項上的快照（商品名稱 ＋ SKU 代碼），不是識別碼。**
        `order_items.product_id`／`sku_id` 在本系統是明訂的「僅供參考、可能指向已不存在
        的資料、消費端絕不可依賴它解析得到」，用它們分組會直接違反那句話；因此本回應
        **也不回傳它們**——回傳一個可能失效的 id，唯一的用途是讓前端做出一個會 404 的連結。

        代價是**商品改名後會出現兩列**。這是誠實的：那些訂單列上真的寫著兩個名字。
      properties:
        product_title: { type: string }
        sku_code: { type: string }
        quantity:
          type: integer
          format: int64
          description: 售出件數。**這是數量不是金額**，介面不得以貨幣格式呈現。
        gross_amount:
          allOf: [{ $ref: '#/components/schemas/MinorUnitAmount' }]
          description: |
            **折扣前**的品項金額（單價 × 數量），**不含運費**。

            訂單層的折扣是整筆訂單的一個百分比，把它攤回品項需要一個分攤規則，而任何
            分攤規則都會產生一個對不上任何單據的每商品數字。所以這一欄回答的是
            **「賣了多少貨」**，不是「這個商品貢獻多少收入」，介面必須這麼寫。

    ProductSalesCurrency:
      type: object
      additionalProperties: false
      required: [currency, items]
      properties:
        currency: { type: string, examples: ["TWD"] }
        items:
          type: array
          description: |
            依 `gross_amount` 遞減排序；同額時依 `quantity` 遞減，再同則依 `sku_code`、
            `product_title` 遞增——**排序是完全確定的**，不交由資料庫決定。
            `limit` **逐幣別**套用。
          items: { $ref: '#/components/schemas/ProductSalesRow' }

    ProductSalesReport:
      type: object
      additionalProperties: false
      required: [shop_id, from, to, limit, timezone, currencies]
      description: |
        同期間的商品銷售排行。**訂單口徑與 `SalesReport` 完全相同**（共用同一組 SQL 條件），
        所以排行不可能包含一筆營業額報表排除掉的訂單。
      properties:
        shop_id: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date }
        limit:
          type: integer
          description: 實際採用的每幣別列數上限（上限 100）。
        timezone:
          allOf: [{ $ref: '#/components/schemas/EffectiveTimezone' }]
          description: |
            排行本身不需要時區來分組（期間已是兩個瞬間），但時區決定了那兩個瞬間，
            所以照樣回報。
        currencies:
          type: array
          description: 依幣別代碼遞增排序。
          items: { $ref: '#/components/schemas/ProductSalesCurrency' }

    ShopPage:
      type: object
      additionalProperties: false
      required: [shops, page, page_size, total]
      properties:
        shops:
          type: array
          items: { $ref: '#/components/schemas/Shop' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: 總筆數（不是金額）。 }

    Page:
      type: object
      additionalProperties: false
      required: [id, type_key, title, slug, status, content_json, published_json, meta, needs_attention, updated_at]
      description: |
        CMS 頁面。**草稿與線上是兩個獨立欄位**：編輯只寫 `content_json`，
        發佈才把它複製進 `published_json`。前台渲染只讀 `published_json`。
      properties:
        id: { type: integer }
        type_key: { type: string }
        title: { type: string }
        slug:
          type: string
          description: "商家內唯一。`home` 是保留字（對應網站根路徑），其 slug 不可修改。"
        status:
          type: integer
          enum: [0, 1]
          description: "`0` 草稿／`1` 已發佈。"
        content_json:
          type: object
          description: 工作副本（草稿）。schema 中 `x-editor` 標註為 `richtext` 的字串欄位於寫入時依單一 allowlist 消毒（改寫而非拒絕），回應為實際儲存的值。
        published_json:
          oneOf: [{ type: object }, { type: 'null' }]
          description: 線上內容；從未發佈過為 `null`。
        meta: { type: object }
        needs_attention:
          type: boolean
          description: |
            內容 schema 註冊後，此頁的草稿（或已發佈快照）不再通過驗證（change headless-content-store）。
            已發佈內容照常提供；草稿必須修到通過才能再儲存內容或發佈。以通過驗證的內容儲存、或發佈修正後的草稿即清除。
        updated_at: { type: string, format: date-time }
        page_schema:
          oneOf: [{ type: object }, { type: 'null' }]
          description: 目前主題對應此 `type_key` 的 schema；主題不支援此頁型時為 `null`。單一頁面查詢才會帶。
        incompatible:
          type: boolean
          description: 目前主題是否**不**支援此頁型。單一頁面查詢才會帶。

    PageListEntry:
      type: object
      additionalProperties: false
      required: [id, type_key, title, slug, status, incompatible, needs_attention, updated_at]
      properties:
        id: { type: integer }
        type_key: { type: string }
        title: { type: string }
        slug: { type: string }
        status: { type: integer, enum: [0, 1] }
        incompatible: { type: boolean }
        needs_attention: { type: boolean }
        updated_at: { type: string, format: date-time }

    # ── 後台：內容 schema 註冊（change headless-content-store 第一個切片）──
    ContentSchemaVersionInfo:
      type: object
      additionalProperties: false
      required: [version, format, sha256, source, created_by_user_id, created_at, has_snapshot]
      properties:
        version: { type: integer, minimum: 1 }
        format:
          type: integer
          enum: [1, 2]
          description: "`1`：由舊主題回填或 demo seed 寫入；`2`：由人註冊的 `content.schema.json`。"
        sha256: { type: string }
        source:
          type: string
          description: "`theme_backfill` 或 `registered`。"
        created_by_user_id:
          oneOf: [{ type: integer }, { type: 'null' }]
          description: 註冊此版本的人（稽核）；回填與 seed 寫入的版本為 `null`。
        created_at: { type: string, format: date-time }
        has_snapshot:
          type: boolean
          description: 此版本註冊時是否為有風險的文件保存了內容快照。

    ContentSchemaVersion:
      type: object
      additionalProperties: false
      required: [version, format, sha256, source, created_by_user_id, created_at, has_snapshot, schema]
      properties:
        version: { type: integer, minimum: 1 }
        format: { type: integer, enum: [1, 2] }
        sha256: { type: string }
        source: { type: string }
        created_by_user_id:
          oneOf: [{ type: integer }, { type: 'null' }]
        created_at: { type: string, format: date-time }
        has_snapshot: { type: boolean }
        schema:
          type: object
          description: 儲存的 schema 文件（format 1 或 2，見 `docs/content-schema.md`）。
        snapshot:
          type: object
          description: 僅在 `include=snapshot` 且該版本有快照時出現：`{documents:[{kind,key,status,draft,published?}]}`。

    ContentSchemaDocumentReport:
      type: object
      additionalProperties: false
      required: [kind, key, status, removed_paths, invalid, published_invalid]
      properties:
        kind: { type: string, enum: [page, global] }
        key:
          type: string
          description: 頁面的 slug；全域內容為 `global`。
        status:
          type: string
          enum: [ok, needs_attention, orphaned]
          description: |
            `ok`：新 schema 下仍通過；`needs_attention`：草稿（或已發佈快照）不再通過驗證；
            `orphaned`：此頁的 `type_key` 不在新 schema 內。
        removed_paths:
          type: array
          items: { type: string }
          description: 新 schema 會丟棄的有值欄位（JSON Pointer，最多 50 筆）；空值（`""`、`[]`、`{}`、`null`）不算。
        invalid:
          type: array
          items: { $ref: '#/components/schemas/ValidationDetail' }
          description: 草稿在新 schema 下的驗證問題（最多 10 筆）。
        published_invalid:
          type: boolean
          description: 已發佈快照在新 schema 下不再通過驗證；它仍照常對外提供。

    ContentSchemaReport:
      type: object
      additionalProperties: false
      required: [documents]
      properties:
        documents:
          type: array
          items: { $ref: '#/components/schemas/ContentSchemaDocumentReport' }

    ContentSchemaRegisterResult:
      type: object
      additionalProperties: false
      required: [version, changed, dry_run, report]
      properties:
        version:
          type: integer
          description: 呼叫後生效的版本；dry run 時為目前生效的版本（尚無則 `0`）。
        changed:
          type: boolean
          description: 送出的 schema 與生效版本不同。相同時為 `false` 且版本不增加。
        dry_run: { type: boolean }
        would_register_version:
          type: integer
          description: 僅 dry run：若正式註冊會得到的版本號（內容相同時為 `0`）。
        report: { $ref: '#/components/schemas/ContentSchemaReport' }

    ContentSchemaVersionList:
      type: object
      additionalProperties: false
      required: [versions]
      properties:
        versions:
          type: array
          items: { $ref: '#/components/schemas/ContentSchemaVersionInfo' }

    # ── 後台：RBAC ────────────────────────────────────────────
    Permission:
      type: object
      additionalProperties: false
      required: [id, name, description]
      properties:
        id: { type: integer }
        name:
          type: string
          description: 權限節點，如 `product.edit`、`order.cancel`。
          examples: ["product.edit"]
        description: { type: string }

    Role:
      type: object
      additionalProperties: false
      required: [id, name, scope, merchant_assignable, permissions]
      properties:
        id: { type: integer }
        name: { type: string }
        merchant_assignable:
          type: boolean
          description: |
            商家層呼叫者（`user.manage_roles`／`user.manage_members`）是否可指派或邀請此角色
            （change merchant-staff-role）。`merchant_owner` 為 false：只有平台能授予或移除。
        scope:
          type: string
          enum: [platform, merchant]
          description: "`platform` 角色跨全站；`merchant` 角色在指派時綁定單一商家。"
        permissions:
          type: array
          description: 權限節點名稱。
          items: { type: string }

    ShopPermissions:
      type: object
      additionalProperties: false
      required: [shop_id, user_id, permissions]
      description: |
        呼叫者**自己**在某商家的有效權限節點（change admin-commerce-catalog）。
        後台前端據此決定哪些分頁與按鈕該出現——它是體驗層，**不是安全邊界**：
        伺服器端的 `RequireShopPermission` 永遠是唯一權威。
      properties:
        shop_id: { type: integer }
        user_id: { type: integer }
        permissions:
          type: array
          description: 三層判定後為允許的權限節點名稱，依名稱排序。無任何權限時為空陣列。
          items: { type: string }
          examples: [["category.view", "product.edit", "product.view"]]

    ShopUser:
      type: object
      additionalProperties: false
      required: [user_id]
      description: 商家的後台使用者及其在**本商家**的角色。
      properties:
        user_id: { type: integer }
        email: { type: string }
        status: { type: integer, description: 帳號狀態（`users.status`）。 }
        membership_status:
          type: integer
          enum: [0, 1]
          description: 本店成員資格狀態：1 啟用、0 停用（change merchant-staff-role；與帳號狀態無關）。
        roles:
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: false
                required: [id, name]
                properties:
                  id: { type: integer }
                  name: { type: string }
                  merchant_assignable: { type: boolean }
            - type: 'null'

    # ── 渲染 ──────────────────────────────────────────────────
    RenderBundle:
      type: object
      additionalProperties: false
      required: [shop, page]
      description: |
        用戶端無關的 SDUI 契約：商家站台與原生 APP 消費**同一個結構**。
        消費端遇到未知的區塊型別 MUST 優雅略過，不得整頁崩潰。
      properties:
        shop:
          type: object
          additionalProperties: false
          required: [id, name, content]
          properties:
            id: { type: integer }
            name: { type: string }
            content:
              description: 全站內容（已依 schema 補齊預設值、剔除未定義鍵）。
        page:
          type: object
          additionalProperties: false
          required: [type_key, title, content, seo]
          properties:
            type_key: { type: string }
            title: { type: string }
            content:
              description: 頁面內容（已 hydrate）。
            seo:
              description: SEO 中繼資料。

paths:

  # ═══════════════════════ health ═══════════════════════
  /healthz:
    get:
      tags: [health]
      operationId: healthz
      summary: 健康檢查
      description: 唯一不在 `/api/v1` 底下的路由。相依檢查失敗時回 503 `unhealthy`。
      security: []
      responses:
        "200":
          description: 健康。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        "503":
          description: 相依檢查失敗。`code = unhealthy`。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ═══════════════════════ 前台公開目錄 ═══════════════════════
  /api/v1/shop/products:
    get:
      tags: [storefront-catalog]
      operationId: listPublishedProducts
      summary: 列出已發佈商品
      description: |
        **無需任何認證**，只需租戶解析（`X-Publishable-Key`）。
        只回傳 `status = 1` 的商品；每個商品都帶 `skus`（依 `id` 遞增）。

        帶 `category`（分類 slug）時只回傳屬於該分類**或其任一子孫分類**的商品，每個商品至多一次，
        `total` 為篩選後筆數。排序：先列**直接**屬於該分類的商品（依商家在後台設定的手動順序，
        再依 `id`），再列只經由子分類到達的商品（依 `id`）。slug 不存在（或屬於他店）回 200 與空列表。
        不帶 `category` 時依 `id` 排序，行為不變。
      security: []
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: category
          in: query
          required: false
          description: 分類 slug（含子分類）。
          schema: { type: string }
          examples:
            newArrivals:
              value: new-arrivals
      responses:
        "200":
          description: 已發佈商品的一頁。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/ShopDisabled' }

  /api/v1/shop/categories:
    get:
      tags: [storefront-catalog]
      operationId: listPublicCategories
      summary: 取得商家的分類樹
      description: |
        **無需任何認證**，只需租戶解析（`X-Publishable-Key`）。回傳整棵分類樹
        （不分頁，單一商家的分類是數十級），同層依 `position`、`id` 遞增。
        與後台 `GET .../categories` 的預設輸出同形狀。
      security: []
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
      responses:
        "200":
          description: 分類樹。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/CategoryNode' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/ShopDisabled' }

  /api/v1/shop/products/{slug}:
    get:
      tags: [storefront-catalog]
      operationId: getPublishedProduct
      summary: 以 slug 取得單一已發佈商品
      description: 無需認證。草稿商品在此一律 404（不區分「不存在」與「未發佈」）。
      security: []
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 商品（含 `skus`）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/ShopDisabled' }

  /api/v1/shop/shipping-methods:
    get:
      tags: [storefront-catalog]
      operationId: listPublicShippingMethods
      summary: 列出可選的運送方式與運費
      description: |
        **無需認證**——買家必須在還沒有任何身分之前就看得到運費。
        **只回傳啟用中的方式**：商家在後台停用某方式後，前端下次抓就看不到它（不必自行過濾）。

        結帳時把選中的 `id` 送回 `shipping_method_id`。
      security: []
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
      responses:
        "200":
          description: 啟用中的運送方式。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [shipping_methods]
                properties:
                  shipping_methods:
                    type: array
                    items: { $ref: '#/components/schemas/PublicShippingMethod' }
              examples:
                twoMethods:
                  value:
                    shipping_methods:
                      - { id: 1, name: "台北市當日配送", carrier: "自有車隊", flat_rate: 200 }
                      - { id: 2, name: "門市自取", carrier: "門市", flat_rate: 0 }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/ShopDisabled' }

  # ═══════════════════════ 前台會員認證 ═══════════════════════
  /api/v1/shop/auth/register:
    post:
      tags: [storefront-auth]
      operationId: memberRegister
      summary: 註冊本商家的會員身分
      description: |
        **顧客身分以商家為界**：同一個 email 在兩家商家是**兩筆互不相干的身分與密碼**，
        沒有任何跨店沿用的路徑。

        **「認領」分支**：若這個 email 在本店已有一個**無密碼身分**（訪客結帳留下的），
        本次註冊會為它設定密碼並登入——該身分的歷史訂單與點數因此自動浮現，無需任何資料搬移。
        成功回應與全新註冊**逐位元組相同**。

        失敗一律回 `422 registration_failed` 且**不說明原因**（不洩漏該 email 是否已是本店顧客）。
        唯二會說明原因的是格式問題：email 格式、密碼長度不足 8。
      security: []
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: 註冊（或認領）成功，直接取得權杖。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "422": { $ref: '#/components/responses/ValidationFailed' }
        "429": { $ref: '#/components/responses/TooManyRequests' }
        "503": { $ref: '#/components/responses/ShopDisabled' }

  /api/v1/shop/auth/login:
    post:
      tags: [storefront-auth]
      operationId: memberLogin
      summary: 會員登入
      description: |
        僅比對**本商家**的身分。在別家商家設定的密碼在此一律 401，即使 email 與密碼都相同。
        無密碼身分（訪客結帳留下的）也一律 401——它要先經由註冊被認領。
      security: []
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: 登入成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "429": { $ref: '#/components/responses/TooManyRequests' }
        "503": { $ref: '#/components/responses/ShopDisabled' }

  /api/v1/shop/auth/refresh:
    post:
      tags: [storefront-auth]
      operationId: memberRefresh
      summary: 換發會員權杖
      description: refresh token **一次性**：成功後舊值立即失效，回應帶新的一組。
      security: []
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: 換發成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "429": { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/shop/auth/logout:
    post:
      tags: [storefront-auth]
      operationId: memberLogout
      summary: 撤銷會員 refresh token
      description: 撤銷指定的 refresh token。已失效或不存在的值同樣回 204（冪等）。
      security: []
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "400": { $ref: '#/components/responses/BadRequest' }

  /api/v1/shop/me:
    get:
      tags: [storefront-auth]
      operationId: memberMe
      summary: 目前登入的會員
      security: [{ memberJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
      responses:
        "200":
          description: |
            會員基本資料。`email` / `phone` **只在有值時出現**（不是回 `null`）。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id]
                properties:
                  id: { type: integer }
                  email: { type: string }
                  phone: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ═══════════════════════ 購物車 ═══════════════════════
  /api/v1/shop/cart:
    get:
      tags: [storefront-cart]
      operationId: getCart
      summary: 取得目前的購物車
      description: |
        沒有存取控制參數：購物車一律是「權杖裡的 `member_id` 的那一台」，
        路由不接受購物車 id 也不接受會員 id——**沒有 id 可以竄改**。
      security: [{ memberJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
      responses:
        "200":
          description: 購物車（可能是空的）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/v1/shop/cart/items:
    post:
      tags: [storefront-cart]
      operationId: addCartItem
      summary: 加入品項
      description: |
        **合併鍵是 `(sku_id, gift_message)`**：訊息相同才累加數量，訊息不同就是新的一列。
        回應是**整台購物車**（不是單一品項）。
      security: [{ memberJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sku_id, quantity]
              properties:
                sku_id: { type: integer }
                quantity: { type: integer, format: int32, minimum: 1 }
                gift_message:
                  type: string
                  maxLength: 500
                  description: 選填，上限 500 字元（rune）。省略即空字串。
      responses:
        "201":
          description: 加入成功，回傳整台購物車。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [storefront-cart]
      operationId: clearCart
      summary: 清空購物車
      security: [{ memberJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/v1/shop/cart/items/{itemID}:
    parameters:
      - $ref: '#/components/parameters/PublishableKey'
      - name: itemID
        in: path
        required: true
        description: 品項列的 id。歸屬驗證在服務層完成——別人的品項一律 404。
        schema: { type: integer, minimum: 1 }
    put:
      tags: [storefront-cart]
      operationId: updateCartItemQuantity
      summary: 修改品項數量
      description: |
        **刻意只收 `quantity`，不收 `gift_message`。** 改訊息等於改變這一列的
        `(sku, message)` 身分，於是可以人工製造出兩列完全相同的品項——那是加入時的累加語意
        永遠不會產生、也沒有任何東西會修復的狀態。要改訊息請「移除再重新加入」。
      security: [{ memberJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  format: int32
                  description: 設為 `0` 等同移除該列。
      responses:
        "200":
          description: 修改成功，回傳整台購物車。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [storefront-cart]
      operationId: removeCartItem
      summary: 移除品項
      security: [{ memberJWT: [] }]
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ═══════════════════════ 會員訂單 ═══════════════════════
  /api/v1/shop/checkout:
    post:
      tags: [storefront-order]
      operationId: memberCheckout
      summary: 以目前購物車結帳
      description: |
        在**單一資料庫交易**內完成：驗證每個品項可購買 → 原子扣庫存 → 建立訂單與訂單品項 →
        將來源購物車標記為已轉換。任一步失敗整筆回滾（不建單、不動庫存、不動購物車）。

        運送方式與配送日的驗證發生在**交易之前**：驗證失敗時庫存與購物車狀態完全不受影響。

        顧客所屬會員等級的折扣**由伺服器決定並自動套用**（見 `MemberTier.discount_percent`），
        請求主體無法指定折扣。結帳前要預估折抵金額，請讀 `GET /api/v1/shop/points` 的
        `level.discount_percent` 並套用同一條整數公式。

        帶 `Idempotency-Key` 時，同一把 key 的重送會**回放**原本那筆訂單（201 ＋
        `Idempotency-Replayed: true`），不會建立第二筆。這解決的不是雙擊——購物車的
        「已轉換」保護早就擋住雙擊了，但它回的 409 **不告訴你訂單是哪一筆**，於是回應
        遺失時你仍然無從得知購買是否成立。
      security: [{ memberJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberCheckoutRequest' }
            examples:
              withShipping:
                summary: 指定運送方式與配送日
                value:
                  recipient_name: "王小明"
                  phone: "0912345678"
                  line1: "台北市大安區復興南路一段 100 號 5 樓"
                  shipping_method_id: 1
                  requested_delivery_date: "2026-08-05"
      responses:
        "201":
          description: |
            訂單成立。帶 `Idempotency-Key` 的重送回放原訂單時**同樣是 201、同樣的主體**，
            差別只在 `Idempotency-Replayed` 標頭。
          headers:
            Idempotency-Replayed:
              description: 僅在這是一次回放時出現，值為 `true`。第一次請求不帶此標頭。
              schema: { type: string, examples: ["true"] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "409":
          description: |
            帶同一把 `Idempotency-Key` 的另一個請求仍在處理中（`idempotency_key_in_progress`），
            結果尚未確定。稍後以相同 key 與相同主體重試即可——屆時會拿到回放，或（前一次失敗
            並釋放了 key 時）一次全新的結帳。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/shop/orders:
    get:
      tags: [storefront-order]
      operationId: listMyOrders
      summary: 列出自己的訂單
      security: [{ memberJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/PublishableKey'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
