                  oneOf: [{ type: integer, minimum: 0, maximum: 100 }, { type: 'null' }]
      responses:
        "201":
          description: 已建立。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberTier' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/member-tiers/{memberTierID}:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
      - name: memberTierID
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [admin-commerce]
      operationId: getMemberTier
      summary: 取得單一會員等級
      description: 需要商家層 `member_tier.view`。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 會員等級。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberTier' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-commerce]
      operationId: updateMemberTier
      summary: 修改會員等級
      description: 需要商家層 `member_tier.edit`。調整門檻後，會員等級在下一次點數異動時重新評估。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                min_points: { type: integer, format: int32, minimum: 0 }
                discount_percent:
                  oneOf: [{ type: integer, minimum: 0, maximum: 100 }, { type: 'null' }]
      responses:
        "200":
          description: 已修改。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberTier' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [admin-commerce]
      operationId: deleteMemberTier
      summary: 刪除會員等級
      description: 需要商家層 `member_tier.delete`。
      security: [{ adminJWT: [] }]
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/shops/{shopID}/members:
    get:
      tags: [admin-commerce]
      operationId: listMembersAdmin
      summary: 列出商家的顧客
      description: |
        需要商家層 `member.view`（change member-directory）。顧客身分以商家為界，本端點只回傳
        `{shopID}` 的顧客。

        **這個端點的主要設計內容是它不回傳什麼**，見 `Member` schema 的說明：沒有 `password_hash`、
        沒有 `phone`、沒有任何由訂單推導的彙總。

        搜尋 `q` 是子字串比對而非精確比對。**列舉面是列表端點本身，不是搜尋**——一份分頁名冊
        本來就可以被逐頁讀完，只給精確比對只會增加合法商家的摩擦而不減少任何暴露。界定它的是
        `member.view`、`page_size` 的上限，以及平台刻意不提供匯出端點。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          required: false
          description: |
            關鍵字：對 email 做大小寫不敏感的子字串比對；可解析為正整數時另比對顧客識別碼
            （商家從訂單詳情讀到「會員 #57」，把 57 貼進來應該要能用——與訂單列表的 `q` 同型）。
          schema: { type: string }
      responses:
        "200":
          description: 顧客的一頁。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/shops/{shopID}/members/{memberID}:
    get:
      tags: [admin-commerce]
      operationId: getMemberAdmin
      summary: 取得單一顧客
      description: |
        需要商家層 `member.view`（change member-directory）。回應形狀與列表中的元素完全相同。

        兩種跨商家有兩種答案：呼叫者無權存取該商家時回 **403**（cross-shop access guard）；
        呼叫者有權存取該商家但 `{memberID}` 屬於另一商家時回 **404**——那一列不在這家店，
        說「不存在」比說「你沒權限碰那個」洩漏更少。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: memberID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 顧客。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/shops/{shopID}/members/{memberID}/points:
    get:
      tags: [admin-commerce]
      operationId: getMemberPointsAdmin
      summary: 查詢顧客的點數與等級
      description: |
        需要商家層 `point.view`。`{memberID}` 直接指向 `members` 列——
        顧客身分以商家為界，跨商家的 id 在此一律 404。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: memberID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 點數與等級。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPoints' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/shops/{shopID}/members/{memberID}/points/transactions:
    get:
      tags: [admin-commerce]
      operationId: listMemberPointTransactionsAdmin
      summary: 查詢顧客的點數異動明細
      description: 需要商家層 `point.view`。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: memberID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          description: 異動明細的一頁。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PointTransactionPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/shops/{shopID}/members/{memberID}/points/adjust:
    post:
      tags: [admin-commerce]
      operationId: adjustMemberPoints
      summary: 人工調整顧客點數
      description: |
        需要商家層 `point.adjust`。`points_delta` 必須非零、`reason` 必須非空——
        人工調整永遠留下可稽核的理由。調整後等級立即重新評估。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: memberID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [points_delta, reason]
              properties:
                points_delta:
                  type: integer
                  format: int32
                  description: 有號、非零。**這是點數不是金額。**
                reason: { type: string, maxLength: 200 }
      responses:
        "200":
          description: 調整後的點數與等級。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPoints' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  # ═══════════════════════ 商家層：前端接入 ═══════════════════════
  /api/v1/admin/shops/{shopID}/publishable-keys:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
    get:
      tags: [admin-client]
      operationId: listPublishableKeys
      summary: 列出 publishable keys（含已撤銷）
      description: |
        需要商家層 `publishable_key.view`。金鑰值**完整回傳、不遮罩**——它是公開識別碼。
        已撤銷的金鑰仍留在列表中，帶 `revoked_at`。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 金鑰清單（依 `id` 遞增）。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { $ref: '#/components/schemas/PublishableKey' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    post:
      tags: [admin-client]
      operationId: createPublishableKey
      summary: 產生新的 publishable key
      description: |
        需要商家層 `publishable_key.create`（**商家自助**：金鑰值是隨機的，
        命名空間不存在競爭，輪替是商家自己的作業節奏）。
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                label: { type: string, maxLength: 100 }
      responses:
        "201":
          description: 已產生。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishableKey' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/publishable-keys/{keyID}:
    delete:
      tags: [admin-client]
      operationId: revokePublishableKey
      summary: 撤銷 publishable key
      description: |
        需要商家層 `publishable_key.revoke`。**撤銷立即生效**，不等快取過期。
        軟刪除：金鑰仍留在列表中並帶上 `revoked_at`。重複撤銷同樣回 204。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: keyID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/shops/{shopID}/allowed-origins:
    parameters:
      - $ref: '#/components/parameters/ShopIDPath'
    get:
      tags: [admin-client]
      operationId: listAllowedOrigins
      summary: 列出商家登記的瀏覽器 origin
      description: |
        **需要平台層 `shop.manage_client_origins`**（不是商家層）——
        origin 是全域競爭的命名空間，與網域綁定同理。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 已登記的 origin（依 `id` 遞增）。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [origins]
                properties:
                  origins:
                    type: array
                    items: { $ref: '#/components/schemas/AllowedOrigin' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    post:
      tags: [admin-client]
      operationId: createAllowedOrigin
      summary: 登記瀏覽器 origin
      description: |
        **需要平台層 `shop.manage_client_origins`**。origin **全域唯一**：
        第二個宣稱同一個 origin 的商家會被拒（422），不會靜默共用 CORS 授權。
        格式必須是 `scheme://host[:port]`，不含路徑、不含萬用字元。**立即生效。**
      security: [{ adminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [origin]
              properties:
                origin: { type: string, examples: ["https://ondo.example.com"] }
                purpose:
                  type: string
                  enum: [storefront, admin]
                  default: storefront
                  description: |
                    省略＝`storefront`。不屬於這兩值回 422。同一個 origin 不能同時是兩種用途
                    （全域唯一），重複登記回 422。
      responses:
        "201":
          description: 已登記。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllowedOrigin' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  # ═══════════════════════ 商家設定與營運報表 (change merchant-reports) ═══════════════════════

  /api/v1/admin/shops/{shopID}/settings:
    put:
      tags: [admin-commerce]
      operationId: updateShopSettings
      summary: 更新商家自己的設定（時區與後台品牌）
      description: |
        需要**商家層** `shop.update`（既有節點）。

        刻意**不是**擴充既有的 `PUT /api/v1/admin/shops/{shopID}`：那一條是**平台層**的
        （守衛是平台權限判定，商家自己碰不到），而且它的主體是主題／內容／狀態——把時區
        塞進去會讓「更新主題內容」變成一個也能順手改掉時區的請求。

        **`timezone` 送 `null`（或省略）＝ 清除設定**，回到平台預設。這與「把它設成平台
        預設的那個字串」是兩件不同的事：只有前者會在報表上被標示為 `source: "default"`，
        也只有前者會跟著平台日後調整預設值。

        **`admin_branding`**（change admin-api-public-exposure，選填；`shop.update`）：
        `{logo_url, primary_color, accent_color}`，顏色為 `#RRGGBB`，`logo_url` 在媒體已設定時必須位於
        影像網域。**整個物件取代**儲存值（空字串或 `null` 清除該鍵，`null`／`{}` 清除全部）；
        **省略 `admin_branding` ＝ 不變**。只送 `admin_branding`（沒有 `timezone` 鍵）時
        **時區不受影響**；兩個鍵都沒送的空主體維持既有語意（清除時區）。

        本端點**不會**改動商家的名稱、狀態、主題或全域內容。

        刻意**沒有對應的 GET**：沒有消費者。生效中的時區由報表回應自己帶著
        （`timezone.name` ／ `timezone.source`），而那是唯一需要知道它的地方。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                timezone:
                  oneOf: [{ type: string }, { type: 'null' }]
                  description: |
                    IANA 時區名稱（例如 `Asia/Taipei`）。`null` 或省略即清除設定。

                    **不接受固定 UTC 偏移量**（`+08:00`）：偏移量無法表達日光節約時間的切換，
                    其錯誤只會在切換當日出現一次，而且不會有任何錯誤訊息。
                    亦不接受 `Local`——它會解析成伺服器自己的時區，那正是這個欄位要消除的歧義。
                  examples: ["Asia/Taipei"]
                admin_branding:
                  oneOf:
                    - $ref: '#/components/schemas/AdminBranding'
                    - type: 'null'
                  description: 後台品牌；省略＝不變。
      responses:
        "200":
          description: 更新後的設定。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopSettings' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/ecpay-credentials:
    get:
      tags: [admin-commerce]
      operationId: getECPayCredentials
      summary: 檢視商家自己的 ECPay 憑證（遮罩）
      description: |
        需要商家層 `payment_credential.manage`（change ecpay-per-shop-credentials 唯一的
        新權限節點；只授予 `merchant_owner`，`editor` 沒有這個節點）。

        **`hash_key`／`hash_iv` 從不出現在回應裡**——只回報是否已設定。這與
        `password_hash` 從不序列化是同一條規則。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
      responses:
        "200":
          description: 憑證狀態（`configured` 為 `false` 時只有 `shop_id`／`provider`／`configured`）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ECPayCredentials' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

    put:
      tags: [admin-commerce]
      operationId: putECPayCredentials
      summary: 設定或更新商家自己的 ECPay 憑證
      description: |
        需要商家層 `payment_credential.manage`。

        `hash_key`／`hash_iv` 省略或空字串＝**沿用既有值**——沒有任何方式能讀出已存
        的密鑰，因此「留空＝不變更」是唯一合理的語意。**首次設定時兩者皆為必填**
        （沒有既有值可以沿用）。`merchant_id` 每次都會覆蓋。`choose_payment` 為
        `null` 或空字串會清除設定，回到 provider 內建的 `Credit` 預設。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [merchant_id]
              properties:
                merchant_id: { type: string, description: 綠界商店代號。 }
                hash_key:
                  type: string
                  description: 省略或空字串＝沿用既有值；首次設定為必填。
                hash_iv:
                  type: string
                  description: 省略或空字串＝沿用既有值；首次設定為必填。
                choose_payment:
                  oneOf: [{ type: string }, { type: 'null' }]
                  description: 省略＝不變更；`null` 或空字串＝清除，回到 `Credit` 預設。
      responses:
        "200":
          description: 更新後的憑證狀態（遮罩）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ECPayCredentials' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/reports/sales:
    get:
      tags: [admin-commerce]
      operationId: getSalesReport
      summary: 期間營業額報表（摘要 ＋ 依商家當地日／月分組）
      description: |
        需要商家層 `report.view`（change merchant-reports 唯一的新權限節點）。

        **口徑、對帳分割與金額組合的完整定義見 `ReportAmounts` schema 的說明——請先讀它。**
        摘要重述三句：只計「未取消 ＋ 已付款 ＋ 未退貨」的訂單；時間軸是**訂單建立時間**
        （所以這不是現金流量表）；四類筆數相加等於期間內建立的全部訂單，商家可以自行驗證。

        **`from` / `to` 是必填的。** 一份期間沒有被明講的報表，是一份數字無法被重現的報表——
        伺服器不替呼叫端挑一個預設期間。

        期間的起訖界限與分組的日界線**使用同一個時區**（商家的生效時區）。以不同時區判定
        兩者，會讓一筆訂單出現在某個分組裡卻不在期間內（或反之），而那種錯誤只在跨日邊界顯現。

        期間長度有上限：`group_by=day` 為 366 天、`group_by=month` 為 1830 天，超過回 422。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: from
          in: query
          required: true
          description: 期間起日（商家當地日，`YYYY-MM-DD`，**包含**）。
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: 期間迄日（商家當地日，`YYYY-MM-DD`，**包含**）。
          schema: { type: string, format: date }
        - name: group_by
          in: query
          required: false
          description: 分組粒度，預設 `day`。
          schema: { type: string, enum: [day, month] }
      responses:
        "200":
          description: 期間報表。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesReport' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/reports/products:
    get:
      tags: [admin-commerce]
      operationId: getProductSalesReport
      summary: 期間商品銷售排行
      description: |
        需要商家層 `report.view`。

        **訂單口徑與 `/reports/sales` 完全相同**（共用同一組條件），所以排行不可能含有
        一筆營業額報表排除掉的訂單。

        排行依**訂單品項上的快照**（商品名稱 ＋ SKU 代碼）分組，金額是**折扣前、不含運費**——
        兩者的理由見 `ProductSalesRow` schema。`limit` 逐幣別套用。
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: from
          in: query
          required: true
          description: 期間起日（商家當地日，`YYYY-MM-DD`，**包含**）。
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: 期間迄日（商家當地日，`YYYY-MM-DD`，**包含**）。
          schema: { type: string, format: date }
        - name: limit
          in: query
          required: false
          description: 每個幣別最多回傳幾列。預設 20，上限 100；缺漏或無法解析時使用預設，**不會回 400**。
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: 期間排行。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductSalesReport' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/admin/shops/{shopID}/allowed-origins/{originID}:
    delete:
      tags: [admin-client]
      operationId: deleteAllowedOrigin
      summary: 移除瀏覽器 origin
      description: "**需要平台層 `shop.manage_client_origins`**。立即生效。"
      security: [{ adminJWT: [] }]
      parameters:
        - $ref: '#/components/parameters/ShopIDPath'
        - name: originID
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
