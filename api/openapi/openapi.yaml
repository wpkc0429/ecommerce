        需要平台層 `account.manage`。撤銷全部 refresh token，且該帳號**已簽發的 access token 在下一個請求即被拒絕**。
        不可停用自己、不可停用最後一位啟用中的 `super_admin`（皆 409）。
      security: [{ adminJWT: [] }]
      responses:
        "204": { $ref: '#/components/responses/NoContent' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
