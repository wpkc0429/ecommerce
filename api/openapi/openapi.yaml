      summary: 帳號詳情（含成員資格與角色）
      description: 需要平台層 `account.view`。回應**永不含密碼雜湊**，只有 `has_password` 布林。
      security: [{ adminJWT: [] }]
      responses:
        "200":
          description: 帳號。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDetail' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/accounts/{userID}/memberships:
    parameters:
