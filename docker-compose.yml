name: ecommerce

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      # No fallback on purpose: a missing password fails `docker compose` loudly
      # instead of silently starting with a guessable one. Set it in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    # Loopback only: reachable from this machine, not from the LAN.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ecommerce} -d $${POSTGRES_DB:-ecommerce}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # requirepass: the API's caches and the Lua sliding-window rate limiter live
    # here, so an unauthenticated Redis lets anyone who can reach it reset rate
    # limits or poison caches. The password is passed via the environment and
    # expanded by the container's shell ($$ = literal $ for compose).
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (see .env.example)}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    # Loopback only: reachable from this machine, not from the LAN.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  # S3-compatible object store standing in for Cloudflare R2 in development and
  # tests (change product-images-r2, design D2): the API runs the same
  # aws-sdk-go-v2 code path against it, so presigned PUT behaves like R2.
  #
  # Image choice: MinIO stopped publishing images to Docker Hub/Quay in late
  # 2025; bitnamilegacy/minio is the last pinned community build that is still
  # pullable. It is a throwaway local-dev store, never a production dependency.
  minio:
    image: bitnamilegacy/minio:2025.7.23
    restart: unless-stopped
    environment:
      # No fallbacks, same rule as Postgres/Redis: a missing credential fails
      # `docker compose` loudly instead of starting with minioadmin.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env (see .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (see .env.example)}
      # Buckets created at first start; ":download" = anonymous read-only (the
      # public image domain). The second bucket is for e2e runs, so their
      # objects can be wiped without touching development images.
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-ecommerce-media}:download,${MINIO_BUCKET_E2E:-ecommerce-media-e2e}:download
      # MinIO has no bucket-level CORS API; this is its server-wide equivalent.
      # Browsers PUT presigned uploads straight from the admin origin (design D2).
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://localhost:3001,http://127.0.0.1:3001}
    # Loopback only: reachable from this machine, not from the LAN.
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
  miniodata:
