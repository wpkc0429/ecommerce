<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ecommerce Admin</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <!-- 登入畫面 -->
    <section id="view-login" class="view">
      <div class="card login-card">
        <h1>後台登入</h1>
        <form id="login-form">
          <label>Email <input type="email" id="login-email" required autocomplete="username" /></label>
          <label>密碼 <input type="password" id="login-password" required autocomplete="current-password" /></label>
          <button type="submit" class="primary">登入</button>
          <p id="login-error" class="error" hidden>登入失敗，請確認帳號密碼。</p>
        </form>
      </div>
    </section>

    <!-- 主畫面 -->
    <section id="view-main" class="view" hidden>
      <header class="topbar">
        <strong>Ecommerce Admin</strong>
        <div class="topbar-right">
          <label>商家
            <select id="shop-select"></select>
            <input type="number" id="shop-input" min="1" placeholder="Shop ID" hidden />
          </label>
          <span id="whoami"></span>
          <button id="logout-btn">登出</button>
        </div>
      </header>

      <!-- 導覽由 app.js 依權限產生（design D5） -->
      <nav class="tabs" id="tabs"></nav>
      <p id="no-access" class="error" hidden></p>

      <!-- 頁面清單 -->
      <div id="tab-pages" class="tab-panel" hidden>
        <div class="toolbar">
          <h2>頁面</h2>
          <button id="new-page-btn" class="primary">新增頁面</button>
        </div>
        <table class="table">
          <thead><tr><th>ID</th><th>標題</th><th>slug</th><th>型別</th><th>狀態</th><th>動作</th></tr></thead>
          <tbody id="pages-tbody"></tbody>
        </table>

        <dialog id="new-page-dialog">
          <form id="new-page-form" method="dialog">
            <h3>新增頁面</h3>
            <label>頁面型別 <select id="new-page-type"></select></label>
            <label>標題 <input type="text" id="new-page-title" required /></label>
            <label>Slug <input type="text" id="new-page-slug" required pattern="[a-z0-9-]+" /></label>
            <p id="new-page-error" class="error" hidden></p>
            <div class="dialog-actions">
              <button type="button" id="new-page-cancel">取消</button>
              <button type="submit" class="primary">建立</button>
            </div>
          </form>
        </dialog>
      </div>

      <!-- 頁面編輯器 -->
      <div id="tab-editor" class="tab-panel" hidden>
        <div class="toolbar">
          <h2 id="editor-title">編輯頁面</h2>
          <div class="toolbar-actions">
            <button id="editor-back">← 返回清單</button>
            <button id="editor-preview">預覽</button>
            <button id="editor-save" class="primary">儲存草稿</button>
            <button id="editor-publish" class="publish">發佈</button>
            <button id="editor-unpublish">下架</button>
          </div>
        </div>
        <p id="editor-status" class="hint"></p>
        <p id="editor-error" class="error" hidden></p>
        <form id="editor-form" class="schema-form"></form>
        <details class="seo-box">
          <summary>SEO 設定</summary>
          <label>SEO 標題 <input type="text" id="seo-title" /></label>
          <label>SEO 關鍵字 <input type="text" id="seo-keywords" /></label>
          <label>SEO 描述 <textarea id="seo-description" rows="2"></textarea></label>
        </details>
      </div>

      <!-- 商家全域內容 -->
      <div id="tab-content" class="tab-panel" hidden>
        <div class="toolbar">
          <h2>商家全域內容</h2>
          <button id="content-save" class="primary">儲存（立即生效）</button>
        </div>
        <p id="content-error" class="error" hidden></p>
        <form id="content-form" class="schema-form"></form>
      </div>

      <!-- 商品分類 -->
      <div id="tab-categories" class="tab-panel" hidden>
        <div class="toolbar">
          <h2>商品分類</h2>
          <button id="new-category-btn" class="primary">新增分類</button>
        </div>
        <p id="categories-error" class="error" hidden></p>
        <table class="table">
          <thead><tr><th>ID</th><th>名稱</th><th>slug</th><th>父分類</th><th>排序</th><th>動作</th></tr></thead>
          <tbody id="categories-tbody"></tbody>
        </table>

        <dialog id="category-dialog">
          <form id="category-form" method="dialog">
            <h3 id="category-dialog-title">新增分類</h3>
            <label>名稱 <input type="text" id="category-name" required /></label>
            <label>Slug <input type="text" id="category-slug" required pattern="[a-z0-9-]+" /></label>
            <label>父分類 <select id="category-parent"></select></label>
            <label>排序 <input type="number" id="category-position" step="1" value="0" /></label>
            <p id="category-error" class="error" hidden></p>
            <div class="dialog-actions">
              <button type="button" id="category-cancel">取消</button>
              <button type="submit" class="primary">儲存</button>
            </div>
          </form>
        </dialog>
      </div>

      <!-- 商品清單 -->
      <div id="tab-products" class="tab-panel" hidden>
        <div class="toolbar">
          <h2>商品</h2>
          <div class="filters">
            <input type="search" id="product-q" placeholder="搜尋標題 / slug / SKU 代碼" />
            <select id="product-category"></select>
            <select id="product-status">
              <option value="">全部狀態</option>
              <option value="0">草稿</option>
              <option value="1">已發佈</option>
            </select>
            <button id="product-search">搜尋</button>
          </div>
          <button id="new-product-btn" class="primary">新增商品</button>
        </div>
        <p id="products-error" class="error" hidden></p>
        <table class="table">
          <thead><tr>
            <th>ID</th><th>標題</th><th>slug</th><th>分類</th><th>SKU 數</th>
            <th>價格</th><th>庫存合計</th><th>狀態</th><th>動作</th>
          </tr></thead>
          <tbody id="products-tbody"></tbody>
        </table>
        <div class="pager">
          <button id="products-prev">← 上一頁</button>
          <span id="products-pageinfo"></span>
          <button id="products-next">下一頁 →</button>
        </div>
      </div>

      <!-- 商品編輯器（含巢狀 SKU） -->
      <div id="tab-product-editor" class="tab-panel" hidden>
        <div class="toolbar">
          <h2 id="product-editor-title">編輯商品</h2>
          <div class="toolbar-actions">
            <button id="product-back">← 返回清單</button>
            <button id="product-save" class="primary">儲存</button>
            <button id="product-delete" class="danger">刪除</button>
          </div>
        </div>
        <p id="product-editor-status" class="hint"></p>
        <p id="product-editor-error" class="error" hidden></p>
        <form id="product-form" class="schema-form wide"></form>
      </div>
    </section>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
