server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (change admin-api-public-exposure, design D5/D6).
    #   - XSS is the main way a token leaks, so the main defence is not allowing
    #     it: no inline script/style, same-origin scripts only.
    #   - connect-src 'self' covers the same-origin /api/v1/admin (production
    #     topology). Presigned image uploads PUT straight to R2's S3 endpoint
    #     (change product-images-r2), hence the *.r2.cloudflarestorage.com entry;
    #     a deployment that uses another S3 host adds it here.
    #   - 'wasm-unsafe-eval' + worker-src blob: are for the vendored HEIC decoder
    #     (lib/upload.js), loaded only when a HEIC file is chosen.
    #   - img-src https: because product/logo images live on the image domain.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' https: data: blob:; connect-src 'self' https://*.r2.cloudflarestorage.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri /index.html;
    }
}
